<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALT Solution - Dashboard Corporativo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --alt-bg-main: #03060c;
            --alt-bg-card: rgba(10, 15, 24, 0.70);
            --alt-bg-input: rgba(4, 8, 15, 0.85);
            --alt-primary: #21d4fd;
            --alt-primary-glow: rgba(33, 212, 253, 0.35);
            --alt-success: #00ff88;
            --alt-success-glow: rgba(0, 255, 136, 0.30);
            --alt-warning: #ff9f43;
            --alt-danger: #ff5252;
            --alt-text-main: #f1f5f9;
            --alt-text-muted: #8492a6;
            --alt-border: rgba(33, 212, 253, 0.15);
            --alt-border-focus: #21d4fd;
            --alt-grad-primary: linear-gradient(135deg, #00d4ff 0%, #00ff88 100%);
            --alt-grad-header: linear-gradient(90deg, #21d4fd 0%, #00ff88 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--alt-bg-main);
            background-image:
                linear-gradient(var(--alt-border) 1px, transparent 1px),
                linear-gradient(90deg, var(--alt-border) 1px, transparent 1px);
            background-size: 60px 60px;
            color: var(--alt-text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .main-container {
            width: 100%;
            max-width: 1320px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .top-brand-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(10, 15, 24, 0.90);
            border: 1px solid var(--alt-border);
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
        }

        .brand-logo-text {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--alt-text-main);
        }

        .brand-logo-symbol {
            color: var(--alt-primary);
            font-weight: 900;
            text-shadow: 0 0 10px var(--alt-primary-glow);
        }

        .node-badge {
            font-size: 0.68rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(0, 255, 136, 0.1);
            color: var(--alt-success);
            border: 1px solid var(--alt-success);
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Orbitron', sans-serif;
        }

        .header-genesis {
            background: var(--alt-bg-card);
            border-radius: 20px;
            padding: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--alt-border) !important;
            position: relative;
            overflow: hidden;
        }

        .header-genesis::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--alt-grad-header);
            box-shadow: 0 0 15px var(--alt-primary-glow);
        }

        .user-info h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .user-details {
            font-size: 0.85rem;
            color: var(--alt-text-muted);
        }

        .balance-container {
            text-align: right;
        }

        .balance-label {
            font-size: 0.72rem;
            color: var(--alt-primary);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            display: block;
        }

        .balance-value {
            font-size: 1.9rem;
            margin: 5px 0;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            color: var(--alt-text-main);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--alt-bg-card) !important;
            backdrop-filter: blur(20px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
            border: 1px solid var(--alt-border) !important;
            border-radius: 20px !important;
            padding: 25px !important;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6) !important;
        }

        .card:hover {
            border-color: var(--alt-primary) !important;
            box-shadow: 0 0 25px rgba(33, 212, 253, 0.15) !important;
            transform: translateY(-2px);
        }

        .card h3 {
            margin-top: 0;
            font-size: 1rem;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--alt-border);
            padding-bottom: 12px;
            color: var(--alt-primary);
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 6px;
            color: var(--alt-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input,
        select {
            width: 100% !important;
            padding: 12px !important;
            background: var(--alt-bg-input) !important;
            border: 1px solid var(--alt-border) !important;
            border-radius: 8px !important;
            color: var(--alt-text-main) !important;
            font-size: 0.95rem !important;
            transition: border-color 0.3s, box-shadow 0.3s !important;
            outline: none !important;
        }

        input:focus,
        select:focus {
            border-color: var(--alt-border-focus) !important;
            box-shadow: 0 0 12px var(--alt-primary-glow) !important;
        }

        .btn {
            font-family: 'Orbitron', sans-serif !important;
            font-size: 0.8rem !important;
            letter-spacing: 1px !important;
            text-transform: uppercase !important;
            border-radius: 8px !important;
            font-weight: 700 !important;
            transition: filter 0.3s, box-shadow 0.3s, transform 0.2s !important;
            cursor: pointer;
        }

        .btn-success {
            background: var(--alt-grad-primary) !important;
            color: #03060c !important;
            box-shadow: 0 0 15px var(--alt-success-glow) !important;
            border: none !important;
        }

        .btn:hover {
            filter: brightness(1.15) !important;
            box-shadow: 0 0 25px var(--alt-primary-glow) !important;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--alt-primary);
            color: var(--alt-primary);
        }

        .btn-logout {
            background: var(--alt-danger);
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 0.7rem;
        }

        .popover-overlay {
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 6, 12, 0.85) !important;
            backdrop-filter: blur(15px) !important;
            -webkit-backdrop-filter: blur(15px) !important;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999 !important;
        }

        .popover-content {
            background: rgba(10, 15, 24, 0.90) !important;
            backdrop-filter: blur(25px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(25px) saturate(180%) !important;
            border: 1px solid var(--alt-primary) !important;
            border-radius: 20px !important;
            padding: 35px !important;
            max-width: 850px !important;
            width: 92%;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 20px var(--alt-primary-glow) !important;
            position: relative;
            color: var(--alt-text-main) !important;
            will-change: transform, opacity;
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #popover-title {
            font-family: 'Orbitron', sans-serif !important;
            font-size: 1.3rem !important;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .blur-effect {
            filter: blur(8px);
            transition: filter 0.3s;
        }

        .balance-glow {
            will-change: box-shadow;
            animation: pulse-neon 2s infinite ease-in-out;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.72rem;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        th {
            text-align: left;
            color: var(--alt-primary);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 1px;
            padding: 12px 10px;
            border-bottom: 1px solid var(--alt-border);
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 768px) {
            .header-genesis {
                flex-direction: column;
                text-align: center;
                gap: 20px;
            }

            .balance-container {
                text-align: center;
            }

            .header-actions {
                justify-content: center;
            }

            .top-brand-bar {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(15px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes pulse-neon {
            0% {
                box-shadow: 0 0 5px var(--alt-success-glow);
            }

            50% {
                box-shadow: 0 0 20px var(--alt-success-glow);
            }

            100% {
                box-shadow: 0 0 5px var(--alt-success-glow);
            }
        }
    </style>
</head>

<body>
    <div class="main-container">
        <!-- Barra Superior de Marca e Status da Rede DLT -->
        <div class="top-brand-bar">
            <div class="brand-logo-text">
                <span class="brand-logo-symbol">(α)</span> ALT SOLUTION
            </div>
            <div class="node-badge">
                <i class="fas fa-network-wired"></i> XRPL TESTNET
            </div>
        </div>

        <!-- Cabeçalho Principal da Sessão (Header Gênesis / Colaborador) -->
        <header class="header-genesis">
            <div class="user-info">
                <h2 id="header-title">
                    Ambiente Gênesis - <span id="user-fullname" style="color: var(--alt-primary);">André Luiz
                        Trindade</span>
                </h2>
                <div class="user-details"
                    style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 8px;">
                    <div>
                        <p><i class="fas fa-wallet" style="color: var(--alt-primary);"></i> Wallet: <span
                                id="header-wallet">r...</span></p>
                        <p><i class="fas fa-envelope" style="color: var(--alt-primary);"></i> E-mail: <span
                                id="header-email">andrelt@alts.com</span></p>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button class="btn btn-logout" onclick="encerrarSessao()">
                        <i class="fas fa-right-from-bracket"></i> ENCERRAR SESSÃO
                    </button>
                    <button class="btn btn-outline" id="btn-reset" onclick="resetGenesis()"
                        style="border-color: var(--alt-danger); color: var(--alt-danger); font-size: 0.7rem; padding: 6px 12px; border-radius: 6px; background: transparent; cursor: pointer; font-weight: bold;">
                        <i class="fas fa-trash-can"></i> RESET REVOLVER
                    </button>
                </div>
            </div>

            <!-- Bloco de Exibição de Saldo Multi-Moedas -->
            <div class="balance-container" style="text-align: right; min-width: 320px;">
                <span class="balance-label">
                    SALDO CONSOLIDADO (REDE)
                    <i class="fas fa-eye" id="toggle-balance-icon" onclick="toggleSaldoVisibilidade()"
                        style="cursor: pointer; margin-left: 8px; color: var(--alt-primary);"></i>
                </span>
                <div class="balance-value" id="display-saldo">R$ 0,00</div>
                <div id="display-saldo-detalhado"
                    style="font-size: 0.75rem; color: #aaa; margin-bottom: 10px; font-family: monospace;">
                    XRP: 0.00 | RLUSD: 0.00
                </div>

                <div class="header-actions"
                    style="display: flex; flex-direction: column; gap: 8px; align-items: flex-end;">
                    <div style="display: flex; gap: 8px;">
                        <button id="btn-injetar" class="btn btn-success btn-small"
                            onclick="abrirPopOverInjetar()">Injetar</button>
                        <button class="btn btn-outline btn-small" onclick="abrirPopOverEstorno()"
                            style="border-color: var(--alt-warning); color: var(--alt-warning);">Estornar</button>
                    </div>
                    <div style="display: flex; gap: 6px; margin-top: 2px;">
                        <button class="btn btn-small" onclick="window.abrirRelatorio('colaboradores')"
                            style="background: rgba(0, 255, 136, 0.12); color: var(--alt-success); border: 1px solid var(--alt-success); font-weight: bold;">
                            <i class="fas fa-users"></i> Colaboradores
                        </button>
                        <button class="btn btn-small" onclick="window.abrirRelatorioFinanceiro()"
                            style="background: rgba(33, 212, 253, 0.12); color: var(--alt-primary); border: 1px solid var(--alt-primary); font-weight: bold;">
                            <i class="fas fa-file-invoice-dollar"></i> Financeiro
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Painel Expansível de Relatórios (Fullwidth) -->
        <div id="area-relatorio-fullwidth"
            style="display: none; width: 100%; margin: 10px auto; padding: 20px; background: var(--alt-bg-card); border: 1px solid var(--alt-border); border-radius: 12px; box-sizing: border-box;">
            <div
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--alt-border); padding-bottom: 10px;">
                <h3 id="relatorio-fullwidth-titulo"
                    style="margin: 0; font-size: 1.1rem; font-family: 'Orbitron', sans-serif;">Relatório</h3>
                <button onclick="fecharRelatorioFullWidth()"
                    style="background: transparent; border: 1px solid var(--alt-border); color: var(--alt-text-main); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold;">
                    <i class="fas fa-xmark"></i> RECOLHER PAINEL
                </button>
            </div>
            <div id="relatorio-fullwidth-conteudo"></div>
        </div>

        <!-- Grade Operacional Principal -->
        <main class="dashboard-grid">
            <!-- Cartão 1: Cadastro de Colaboradores -->
            <section class="card">
                <h3><i class="fas fa-user-plus"></i> Cadastrar Colaborador</h3>
                <div class="input-group">
                    <label>NOME DO COLABORADOR</label>
                    <input type="text" id="cad-nome" placeholder="Ex: nome completo">
                </div>
                <div class="input-group">
                    <label>E-MAIL CORPORATIVO (LOGIN)</label>
                    <input type="email" id="cad-email" placeholder="abreviarnome@alts.com">
                </div>
                <div class="input-group">
                    <label>CARGO / SETOR (HIERARQUIA CORPORATIVA)</label>
                    <select id="mat-cargo">
                        <optgroup label="1. Nível Estratégico (C-Level & Board)">
                            <option value="Presidente do Conselho">Presidente do Conselho (Chairman)</option>
                            <option value="Conselheiro Consultivo">Conselheiro Consultivo</option>
                            <option value="CEO">CEO (Diretor Executivo)</option>
                            <option value="COO">COO (Operações)</option>
                            <option value="CFO">CFO (Financeiro)</option>
                            <option value="CTO">CTO (Tecnologia)</option>
                            <option value="CMO">CMO (Marketing)</option>
                            <option value="CHRO">CHRO (Recursos Humanos)</option>
                            <option value="CIO">CIO (Informação)</option>
                            <option value="CLO">CLO (Jurídico)</option>
                            <option value="CCO">CCO (Compliance)</option>
                            <option value="CDO">CDO (Digital/Dados)</option>
                            <option value="Presidente">Presidente</option>
                            <option value="Vice-Presidente Executivo">Vice-Presidente Executivo (EVP)</option>
                        </optgroup>
                        <optgroup label="2. Nível Tático (Diretoria e Gerência Sênior)">
                            <option value="Diretor Regional">Diretor Regional</option>
                            <option value="Diretor de Unidade">Diretor de Unidade</option>
                            <option value="Diretor Adjunto">Diretor Adjunto</option>
                            <option value="Gerente de Divisão">Gerente de Divisão</option>
                            <option value="Gerente Geral">Gerente Geral (GM)</option>
                            <option value="Gerente de Planta">Gerente de Planta</option>
                        </optgroup>
                        <optgroup label="3. Nível de Gestão Intermediária">
                            <option value="Gerente de Departamento">Gerente de Departamento</option>
                            <option value="Gerente de Área">Gerente de Área</option>
                            <option value="Gerente Comercial">Gerente Comercial</option>
                            <option value="Coordenador de Equipe">Coordenador de Equipe</option>
                            <option value="Coordenador de Projetos">Coordenador de Projetos</option>
                            <option value="Supervisor de Vendas">Supervisor de Vendas</option>
                            <option value="Supervisor de Produção">Supervisor de Produção</option>
                            <option value="Supervisor Administrativo">Supervisor Administrativo</option>
                        </optgroup>
                        <optgroup label="4. Nível Técnico e Especialista">
                            <option value="Especialista de Produto">Especialista de Produto</option>
                            <option value="Consultor Interno">Consultor Interno</option>
                            <option value="Arquiteto de Soluções">Arquiteto de Soluções</option>
                            <option value="Analista Sênior">Analista Sênior</option>
                            <option value="Analista Pleno">Analista Pleno</option>
                            <option value="Analista Júnior">Analista Júnior</option>
                            <option value="Analista QA">Analista QA</option>
                            <option value="Líder de Equipe">Líder de Equipe (Team Lead)</option>
                            <option value="Tech Lead">Tech Lead</option>
                            <option value="Encarregado">Encarregado</option>
                        </optgroup>
                        <optgroup label="5. Nível Operacional e Apoio">
                            <option value="Assistente Administrativo">Assistente Administrativo</option>
                            <option value="Assistente de Vendas">Assistente de Vendas</option>
                            <option value="Assistente de RH">Assistente de RH</option>
                            <option value="Auxiliar de Escritório">Auxiliar de Escritório</option>
                            <option value="Auxiliar de Serviços Gerais">Auxiliar de Serviços Gerais</option>
                            <option value="Auxiliar de Estoque">Auxiliar de Estoque</option>
                            <option value="Operador de Máquinas">Operador de Máquinas</option>
                            <option value="Vendedor">Vendedor</option>
                            <option value="Atendente de Suporte">Atendente de Suporte (CSR)</option>
                            <option value="Técnico de Campo">Técnico de Campo</option>
                            <option value="Estagiário">Estagiário</option>
                            <option value="Trainee">Trainee</option>
                            <option value="Jovem Aprendiz">Jovem Aprendiz</option>
                        </optgroup>
                    </select>
                </div>
                <div class="input-group">
                    <label>SENHA DE ACESSO (LETRAS, NÚMEROS E SÍMBOLO)</label>
                    <div style="position: relative;">
                        <input type="password" id="cad-pass" placeholder="Ex: @Exemplo1"
                            style="width: 100%; padding-right: 40px; box-sizing: border-box;">
                        <i class="fas fa-eye" id="toggle-cad-pass"
                            style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--alt-primary);"
                            onclick="window.togglePassword('cad-pass', this)"></i>
                    </div>
                </div>
                <div class="input-group">
                    <label>ASSINATURA DIGITAL (PIN NUMÉRICO)</label>
                    <div style="display: flex; gap: 10px; width: 100%;">
                        <div id="pin-display-screen"
                            style="flex: 2; background: rgba(0,255,136,0.06); color: var(--alt-success); border: 1px dashed var(--alt-success); padding: 10px; text-align: center; font-family: 'Orbitron', monospace; font-weight: bold; font-size: 1.1rem; border-radius: 8px; min-height: 45px; display: flex; align-items: center; justify-content: center;">
                            ------
                        </div>
                        <button type="button" class="btn btn-outline"
                            style="flex: 1; font-size: 0.75rem; white-space: nowrap;" onclick="window.gerarPin()">
                            GERAR PIN
                        </button>
                    </div>
                </div>
                <div class="input-group">
                    <label>WALLET GERADA (XRPL TESTNET)</label>
                    <input type="text" id="cad-wallet" value="Aguardando geração..." readonly style="opacity: 0.8;">
                </div>
                <button class="btn btn-success" id="btn-final-cad" onclick="cadastrarColaborador()" disabled
                    style="width: 100%; padding: 14px; opacity: 0.5;">
                    GERAR CADASTRO
                </button>
            </section>

            <!-- Cartão 2: Envio de Recursos e Transferência DLT -->
            <section class="card">
                <h3><i class="fas fa-paper-plane"></i> Enviar Recurso</h3>
                <div class="input-group">
                    <label>DESTINATÁRIO</label>
                    <select id="send-dest" onchange="autoPreencherDestino()">
                        <option value="">Selecione um destino</option>
                    </select>
                </div>
                <div id="info-destinatario"
                    style="display: none; margin-bottom: 15px; font-size: 0.8rem; color: var(--alt-primary); background: var(--alt-bg-input); padding: 12px; border-radius: 8px; border-left: 3px solid var(--alt-primary);">
                    <p style="margin: 0;"><strong>E-mail:</strong> <span id="info-dest-email"></span></p>
                    <p style="margin: 5px 0 0 0;"><strong>Wallet:</strong> <span id="info-dest-wallet"></span></p>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-bottom: 15px;">
                    <div class="input-group" style="margin-bottom: 0;">
                        <label>MOEDA</label>
                        <select id="send-currency"
                            style="padding: 12px; background: var(--alt-bg-input); color: #fff; border: 1px solid var(--alt-border); border-radius: 8px;">
                            <option value="XRP">XRP (Nativo)</option>
                            <option value="RLUSD">RLUSD (Dólar)</option>
                            <option value="BRL">BRL (Real)</option>
                        </select>
                    </div>
                    <div class="input-group" style="margin-bottom: 0;">
                        <label>VALOR A TRANSFERIR</label>
                        <input type="number" id="send-valor" placeholder="0.00" step="any" min="0.01">
                    </div>
                </div>

                <div
                    style="background: var(--alt-bg-input); padding: 14px; border-radius: 10px; border: 1px solid var(--alt-border);">
                    <label style="color: var(--alt-primary); font-weight: bold;">CONFIRMAR ASSINATURA DIGITAL</label>
                    <input type="email" id="sign-email" placeholder="Seu E-mail de login" style="margin-bottom: 10px;">
                    <div style="position: relative;">
                        <input type="password" id="sign-pass" placeholder="Seu PIN (Senha)"
                            style="width: 100%; padding-right: 40px; box-sizing: border-box;">
                        <i class="fas fa-eye" id="toggle-sign-pass"
                            style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--alt-primary);"
                            onclick="window.togglePassword('sign-pass', this)"></i>
                    </div>
                </div>
                <button class="btn btn-success" id="btn-assinar" style="margin-top: 15px; width: 100%; padding: 14px;"
                    onclick="assinarTransacao()">
                    ASSINAR TRANSAÇÃO
                </button>
            </section>
        </main>
    </div>

    <!-- Modal Popover -->
    <div id="popover" class="popover-overlay" style="display: none;">
        <div class="popover-content" style="position: relative;">
            <h2 id="popover-title" style="color: var(--alt-success);">SUCESSO!</h2>
            <div id="popover-msg">Operação realizada.</div>
            <div id="popover-footer" style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
                <button class="btn btn-success" id="popover-main-btn"
                    style="display: none; width: 100%;">CONCLUIR</button>
                <div id="popover-extra-actions" style="display: flex; gap: 10px; width: 100%;"></div>
                <button class="btn btn-outline" id="popover-close-btn"
                    style="display: none; width: 100%; border: 1px solid var(--alt-border); color: var(--alt-text-main); background: transparent; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold;"
                    onclick="fecharPopover()">FECHAR</button>
            </div>
        </div>
    </div>

    <!-- SDK Oficial da XRPL -->
    <script src="https://unpkg.com/xrpl@2.14.0/build/xrpl-latest-min.js"></script>

    <!-- Importação de Módulos a partir da Raiz do Projeto -->
    <script type="module">
        import { XRPL_CONFIG } from './config/xrpl.config.js';
        import { WalletService } from './config/walletService.js';
        import { XRPLService } from './config/xrplService.js';
        import { myLedger } from './logic/ledger.js';
        import { StorageService } from './logic/storage.js';

        window.XRPL_CONFIG = XRPL_CONFIG;
        window.WalletService = WalletService;
        window.XRPLService = XRPLService;
        window.myLedger = myLedger;
        window.StorageService = StorageService;

        console.log("Módulos carregados com sucesso na raiz do projeto.");
    </script>

    <script>
        let appState = {
            admin: {
                nome: "Andre Luiz Trindade",
                cargo: "Administrador Gênesis",
                wallet: "r...",
                email: "andre@alts.com",
                origem: "Ambiente Gênesis",
                pin: "877873",
                data: "10/04/26-05:00am",
                saldo: 0,
                saldos: { XRP: 0, RLUSD: 0, BRL: 0 }
            },
            colaboradores: [],
            transacoes: []
        };

        let saldoVisivel = true;
        let ledgerCurrentPage = 1;
        const ledgerItemsPerPage = 10;
        let ledgerSearchQuery = "";

        window.onload = async () => {
            try {
                const loggedUser = JSON.parse(localStorage.getItem('usuario_sessao'));

                if (loggedUser) {
                    appState.admin.nome = loggedUser.nome || appState.admin.nome;
                    appState.admin.wallet = loggedUser.wallet || appState.admin.wallet;
                    appState.admin.email = loggedUser.email || appState.admin.email;

                    document.getElementById('user-fullname').innerText = loggedUser.nome;
                    document.getElementById('header-wallet').innerText = loggedUser.wallet;
                    document.getElementById('header-email').innerText = loggedUser.email;

                    const headerTitle = document.getElementById('header-title');
                    if (headerTitle) {
                        if (loggedUser.cargo !== "Administrador Gênesis") {
                            headerTitle.firstChild.textContent = "Ambiente Colaborador - ";
                        } else {
                            headerTitle.firstChild.textContent = "Ambiente Gênesis - ";
                        }
                    }

                    const btnInjetar = document.getElementById('btn-injetar');
                    const btnReset = document.getElementById('btn-reset');

                    if (loggedUser.cargo !== "Administrador Gênesis") {
                        if (btnInjetar) btnInjetar.style.display = 'none';
                        if (btnReset) btnReset.style.display = 'none';
                    } else {
                        if (btnInjetar) btnInjetar.style.display = 'inline-block';
                        if (btnReset) btnReset.style.display = 'inline-block';
                    }

                    filtrarOpcoesDeCargo(loggedUser);
                } else {
                    window.location.replace('index.html');
                    return;
                }
            } catch (error) {
                console.error("Erro Crítico de Inicialização:", error);
            }

            await window.atualizarUI();
        };

        function filtrarOpcoesDeCargo(loggedUser) {
            const selectCargo = document.getElementById('mat-cargo');
            if (!selectCargo) return;

            const storage = window.StorageService;
            const userLevel = loggedUser.hierarchical_level !== undefined ? loggedUser.hierarchical_level : (storage ? storage.getRoleLevel(loggedUser.cargo) : 0);

            const options = selectCargo.querySelectorAll('option');
            options.forEach(option => {
                const roleName = option.value;
                const optionLevel = storage ? storage.getRoleLevel(roleName) : 5;

                if (userLevel === 0) {
                    option.style.display = '';
                } else if (optionLevel <= userLevel) {
                    option.style.display = 'none';
                } else {
                    option.style.display = '';
                }
            });

            for (let i = 0; i < selectCargo.options.length; i++) {
                if (selectCargo.options[i].style.display !== 'none') {
                    selectCargo.selectedIndex = i;
                    break;
                }
            }
        }

        function salvarEstado() {
            localStorage.setItem('genesis_state', JSON.stringify(appState));
            const storage = window.StorageService;
            let usuariosGerais = storage ? storage.getUsers() : (JSON.parse(localStorage.getItem('alt_solution_users')) || []);

            const indexAdmin = usuariosGerais.findIndex(u => u.wallet === appState.admin.wallet || u.email === appState.admin.email);
            if (indexAdmin !== -1) {
                usuariosGerais[indexAdmin].saldos = appState.admin.saldos;
                usuariosGerais[indexAdmin].saldo = appState.admin.saldos ? appState.admin.saldos.XRP : appState.admin.saldo;
                if (storage) storage.saveUser(usuariosGerais[indexAdmin]);
                else localStorage.setItem('alt_solution_users', JSON.stringify(usuariosGerais));
            }

            const sessaoAtual = JSON.parse(localStorage.getItem('usuario_sessao'));
            if (sessaoAtual) {
                sessaoAtual.saldos = appState.admin.saldos;
                sessaoAtual.saldo = appState.admin.saldos ? appState.admin.saldos.XRP : appState.admin.saldo;
                localStorage.setItem('usuario_sessao', JSON.stringify(sessaoAtual));
            }
        }

        window.togglePassword = (inputId, iconElement) => {
            const input = document.getElementById(inputId);
            if (!input) return;
            if (input.type === 'password') {
                input.type = 'text';
                if (iconElement) {
                    iconElement.classList.remove('fa-eye');
                    iconElement.classList.add('fa-eye-slash');
                }
            } else {
                input.type = 'password';
                if (iconElement) {
                    iconElement.classList.remove('fa-eye-slash');
                    iconElement.classList.add('fa-eye');
                }
            }
        };

        window.autoPreencherDestino = () => {
            const destWallet = document.getElementById('send-dest').value;
            const infoContainer = document.getElementById('info-destinatario');
            const infoEmail = document.getElementById('info-dest-email');
            const infoWallet = document.getElementById('info-dest-wallet');

            if (!destWallet) {
                if (infoContainer) infoContainer.style.display = 'none';
                return;
            }

            const storage = window.StorageService;
            const todosUsuarios = storage ? storage.getUsers() : (JSON.parse(localStorage.getItem('alt_solution_users')) || []);
            const destUser = todosUsuarios.find(u => u.wallet === destWallet);

            if (destUser && infoContainer && infoEmail && infoWallet) {
                infoEmail.innerText = destUser.email || 'Não informado';
                infoWallet.innerText = destUser.wallet;
                infoContainer.style.display = 'block';
            } else if (infoContainer) {
                infoContainer.style.display = 'none';
            }
        };

        window.gerarPin = () => {
            const novoPin = Math.floor(100000 + Math.random() * 900000).toString();
            const visor = document.getElementById('pin-display-screen');
            const btnFinal = document.getElementById('btn-final-cad');

            if (visor) {
                visor.innerText = novoPin;
                visor.setAttribute('data-current-pin', novoPin);

                if (btnFinal) {
                    btnFinal.disabled = false;
                    btnFinal.style.opacity = '1';
                    btnFinal.style.cursor = 'pointer';
                }
            }

            const walletSvc = window.WalletService;
            if (walletSvc) {
                const preview = walletSvc.generateWallet();
                const inputWallet = document.getElementById('cad-wallet');
                if (inputWallet) {
                    inputWallet.value = preview.address;
                }
            }
        };

        window.fecharPopover = () => {
            document.getElementById('popover').style.display = 'none';
            const extra = document.getElementById('popover-extra-actions');
            if (extra) extra.innerHTML = "";
            const mainBtn = document.getElementById('popover-main-btn');
            if (mainBtn) mainBtn.style.display = 'none';
            const closeBtn = document.getElementById('popover-close-btn');
            if (closeBtn) closeBtn.style.display = 'none';
        };

        function abrirPopoverUnico(titulo, corTitulo, conteudoHTML, textoBotao, acaoBotao) {
            document.getElementById('popover-title').innerText = titulo;
            document.getElementById('popover-title').style.color = corTitulo;
            document.getElementById('popover-msg').innerHTML = conteudoHTML;

            const mainBtn = document.getElementById('popover-main-btn');
            const closeBtn = document.getElementById('popover-close-btn');
            const extra = document.getElementById('popover-extra-actions');

            if (extra) extra.innerHTML = "";

            if (textoBotao) {
                mainBtn.innerText = textoBotao;
                mainBtn.style.display = "block";
                mainBtn.onclick = acaoBotao || fecharPopover;
            } else {
                mainBtn.style.display = "none";
            }

            closeBtn.style.display = "none";
            document.getElementById('popover').style.display = 'flex';
        }

        window.copiarHash = (hashTexto, elementoBtn) => {
            if (!hashTexto || hashTexto.includes('INTERNO')) return;
            navigator.clipboard.writeText(hashTexto).then(() => {
                const textoOriginal = elementoBtn.innerHTML;
                elementoBtn.innerHTML = '<i class="fas fa-check"></i> COPIADO';
                elementoBtn.style.color = "var(--alt-success)";
                setTimeout(() => {
                    elementoBtn.innerHTML = textoOriginal;
                    elementoBtn.style.color = "var(--alt-primary)";
                }, 2000);
            }).catch(err => console.error("Erro ao copiar Hash:", err));
        };

        window.cadastrarColaborador = async () => {
            const inputNome = document.getElementById('cad-nome');
            const inputEmail = document.getElementById('cad-email');
            const inputSenha = document.getElementById('cad-pass');
            const visorPin = document.getElementById('pin-display-screen');
            const btnCad = document.getElementById('btn-final-cad');

            if (!inputNome || !inputEmail || !inputSenha || !visorPin) return;

            const nome = inputNome.value.trim();
            const email = inputEmail.value.trim().toLowerCase();
            const senha = inputSenha.value;
            const pin = visorPin.innerText.trim();
            const cargo = document.getElementById('mat-cargo').value;

            if (!nome || !email || !senha || pin === "------" || pin === "") {
                alert("Preencha Nome, E-mail, Senha e Gere um PIN para realizar o registro.");
                return;
            }

            try {
                btnCad.disabled = true;
                btnCad.style.opacity = '0.5';
                btnCad.innerText = "GERANDO CARTEIRA XRPL...";

                let realWallet = { address: "", seed: "", publicKey: "" };
                let encryptedSeed = "";
                let saldoInicialXRP = 0;

                const walletSvc = window.WalletService;
                if (walletSvc) {
                    const generated = walletSvc.generateWallet();
                    realWallet.address = generated.address;
                    realWallet.seed = generated.seed;
                    realWallet.publicKey = generated.publicKey;

                    encryptedSeed = walletSvc.encryptSeed(realWallet.seed, pin);

                    btnCad.innerText = "FINANCIANDO VIA FAUCET...";
                    try {
                        const faucetRes = await walletSvc.fundFromFaucet(realWallet.address);
                        if (faucetRes && faucetRes.balance) {
                            saldoInicialXRP = faucetRes.balance;
                        }
                    } catch (faucetErr) {
                        console.warn("Aviso do Faucet na Testnet:", faucetErr);
                    }
                } else {
                    realWallet.address = 'r' + Math.random().toString(36).substring(2, 15);
                }

                document.getElementById('cad-wallet').value = realWallet.address;

                const loggedUser = JSON.parse(localStorage.getItem('usuario_sessao')) || {};
                const storage = window.StorageService;
                const levelCalculado = storage ? storage.getRoleLevel(cargo) : 5;

                const agora = new Date();
                const dataFormatada = agora.toLocaleDateString('pt-BR') + " " + agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

                const config = window.XRPL_CONFIG || { RATES: { XRP_BRL: 3.0 } };
                const saldoBRL = saldoInicialXRP * config.RATES.XRP_BRL;

                const novoColaborador = {
                    nome: nome,
                    cargo: cargo,
                    email: email,
                    senha: senha,
                    pin: pin,
                    wallet: realWallet.address,
                    cipherSeed: encryptedSeed,
                    publicKey: realWallet.publicKey,
                    parent_wallet: loggedUser.wallet || "0x00000000",
                    hierarchical_level: levelCalculado,
                    origem: loggedUser.nome ? `Gestão (${loggedUser.nome})` : "Rede",
                    saldo: saldoInicialXRP,
                    saldos: {
                        XRP: saldoInicialXRP,
                        RLUSD: 0,
                        BRL: 0,
                        caixaBRL: 0
                    },
                    saldoTotal: saldoInicialXRP,
                    historico: [],
                    cadastroEm: dataFormatada
                };

                if (storage) {
                    storage.saveUser(novoColaborador);
                } else {
                    let listaUsuarios = JSON.parse(localStorage.getItem('alt_solution_users')) || [];
                    if (listaUsuarios.some(u => u.email === novoColaborador.email)) {
                        alert("Este e-mail já está integrado à rede ALT.");
                        btnCad.disabled = false;
                        btnCad.style.opacity = '1';
                        btnCad.innerText = "GERAR CADASTRO";
                        return;
                    }
                    listaUsuarios.push(novoColaborador);
                    localStorage.setItem('alt_solution_users', JSON.stringify(listaUsuarios));
                }

                const msgHTML = `
                    <p>O colaborador <strong>${nome}</strong> foi integrado à rede.</p>
                    <p>Wallet: <span style="color:var(--alt-primary); font-family:monospace;">${realWallet.address}</span></p>
                    <p>Saldo Inicial: <strong style="color:var(--alt-success)">${saldoInicialXRP} XRP</strong></p>
                    <p>PIN de Acesso: <strong style="color:var(--alt-success)">${pin}</strong></p>
                    <p>Nível Hierárquico: <strong>${levelCalculado}</strong></p>
                `;

                abrirPopoverUnico("CADASTRO REALIZADO", "var(--alt-success)", msgHTML, "CONCLUIR", fecharPopover);

                inputNome.value = "";
                inputEmail.value = "";
                inputSenha.value = "";
                visorPin.innerText = "------";

                btnCad.disabled = true;
                btnCad.style.opacity = '0.5';
                btnCad.innerText = "GERAR CADASTRO";

                await window.atualizarUI();
            } catch (err) {
                console.error("Erro ao cadastrar colaborador:", err);
                alert("Erro ao cadastrar colaborador na XRPL Testnet.");
                btnCad.disabled = false;
                btnCad.style.opacity = '1';
                btnCad.innerText = "GERAR CADASTRO";
            }
        };

        window.atualizarUI = async () => {
            const saldoElement = document.getElementById('display-saldo');
            const saldoDetalhadoElement = document.getElementById('display-saldo-detalhado');
            const loggedUser = JSON.parse(localStorage.getItem('usuario_sessao')) || {};
            const xrplSvc = window.XRPLService;
            const config = window.XRPL_CONFIG || { RATES: { XRP_BRL: 3.0, RLUSD_BRL: 5.5 } };

            if (xrplSvc && typeof xrplSvc.fetchMarketRates === 'function') {
                try {
                    const liveRates = await xrplSvc.fetchMarketRates();
                    if (liveRates && liveRates.XRP_BRL) {
                        config.RATES.XRP_BRL = liveRates.XRP_BRL;
                    }
                } catch (err) {
                    console.warn("Utilizando taxa estática de suporte:", err);
                }
            }

            let xrpActual = loggedUser.saldos ? loggedUser.saldos.XRP : (loggedUser.saldo || 0);
            let rlusdActual = loggedUser.saldos ? loggedUser.saldos.RLUSD : 0;
            let brlCash = (loggedUser.saldos && loggedUser.saldos.caixaBRL !== undefined) ? loggedUser.saldos.caixaBRL : (loggedUser.caixaBRL || 0);

            if (xrplSvc && loggedUser.wallet && loggedUser.wallet.startsWith('r')) {
                try {
                    const accInfo = await xrplSvc.getAccountInfo(loggedUser.wallet);
                    if (accInfo && accInfo.Balance) {
                        const xrpOnChain = parseFloat(accInfo.Balance) / 1000000;
                        if (xrpActual < xrpOnChain) {
                            xrpActual = xrpOnChain;
                        }
                    }

                    try {
                        const lines = await xrplSvc.getAccountLines(loggedUser.wallet);
                        const rlusdLine = lines.find(l => l.currency === "RLUSD");
                        if (rlusdLine && rlusdLine.balance) {
                            const rlusdOnChain = parseFloat(rlusdLine.balance);
                            if (rlusdActual < rlusdOnChain) {
                                rlusdActual = rlusdOnChain;
                            }
                        }
                    } catch (lineErr) {
                        console.warn("Nenhuma Trustline RLUSD identificada on-chain:", lineErr);
                    }
                } catch (e) {
                    console.warn("Aviso de sincronização on-chain no Dashboard:", e);
                }
            }

            // Patrimônio Total Consolidado em BRL (Caixa Fiduciário + Valor de Mercado dos Criptoativos)
            const valorCriptoBRL = (xrpActual * config.RATES.XRP_BRL) + (rlusdActual * config.RATES.RLUSD_BRL);
            const totalBRL = brlCash + valorCriptoBRL;

            loggedUser.saldo = xrpActual;
            loggedUser.saldos = { XRP: xrpActual, RLUSD: rlusdActual, BRL: totalBRL, caixaBRL: brlCash };
            localStorage.setItem('usuario_sessao', JSON.stringify(loggedUser));

            appState.admin.saldos = loggedUser.saldos;
            appState.admin.saldo = xrpActual;

            if (saldoElement) {
                saldoElement.innerText = totalBRL.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            }

            if (saldoDetalhadoElement) {
                // Formatação precisa para criptoativos (XRP com até 6 decimais/drops se necessário, RLUSD com 2)
                const formatXRP = (val) => Number(val).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 6 });
                const formatRLUSD = (val) => Number(val).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                const formatBRL = (val) => Number(val).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

                saldoDetalhadoElement.innerHTML = `Caixa BRL: <strong>${formatBRL(brlCash)}</strong><br>XRP: ${formatXRP(xrpActual)} | RLUSD: ${formatRLUSD(rlusdActual)}`;
            }

            const select = document.getElementById('send-dest');
            if (select) {
                select.innerHTML = '<option value="">Selecione um destino</option>';
                const storage = window.StorageService;

                let destinatariosPermitidos = [];
                if (storage) {
                    if (loggedUser.cargo === "Administrador Gênesis" || loggedUser.hierarchical_level === 0) {
                        destinatariosPermitidos = storage.getUsers().filter(u => u.wallet !== loggedUser.wallet);
                    } else {
                        destinatariosPermitidos = storage.getDescendantTree(loggedUser.wallet);
                    }
                } else {
                    let usuariosLocais = JSON.parse(localStorage.getItem('alt_solution_users')) || [];
                    destinatariosPermitidos = usuariosLocais.filter(u => u.wallet !== loggedUser.wallet);
                }

                destinatariosPermitidos.forEach(c => {
                    select.innerHTML += `<option value="${c.wallet}">${c.nome} (${c.cargo || 'Colaborador'})</option>`;
                });
            }
        };

        window.toggleSaldoVisibilidade = () => {
            const saldoElement = document.getElementById('display-saldo');
            const saldoDetalhado = document.getElementById('display-saldo-detalhado');
            const icon = document.getElementById('toggle-balance-icon');

            if (saldoElement.classList.contains('blur-effect')) {
                saldoElement.classList.remove('blur-effect');
                if (saldoDetalhado) saldoDetalhado.classList.remove('blur-effect');
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                saldoElement.classList.add('blur-effect');
                if (saldoDetalhado) saldoDetalhado.classList.add('blur-effect');
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        };

        function abrirPopOverInjetar() {
            const sessaoAcesso = JSON.parse(localStorage.getItem('usuario_sessao'));
            if (!sessaoAcesso || sessaoAcesso.cargo !== "Administrador Gênesis") {
                return alert("Acesso Negado: Função exclusiva da Tesouraria Gênesis.");
            }

            const msgHTML = `
                <p style="margin-bottom: 12px;">Insira o montante em <strong>Reais (R$ / BRL)</strong> para o aporte no Caixa Corporativo e registro no Ledger:</p>
                <input type="number" id="input-valor-aporte" placeholder="0,00" step="any" min="0.01" style="width: 100%; padding: 10px; border: 1px solid var(--alt-border); background: var(--alt-bg-input); color: #fff; border-radius: 6px; font-size: 16px; text-align: center; box-sizing: border-box;">
            `;

            const acaoConfirmar = async function () {
                const inputElement = document.getElementById('input-valor-aporte');
                if (!inputElement) return;

                const valorAporteBRL = parseFloat(inputElement.value);
                const sessaoAtual = JSON.parse(localStorage.getItem('usuario_sessao'));

                if (isNaN(valorAporteBRL) || valorAporteBRL <= 0) {
                    return alert("Erro: Insira um valor válido maior que zero.");
                }

                if (!appState.admin.saldos) appState.admin.saldos = { XRP: 0, RLUSD: 0, BRL: 0 };
                appState.admin.saldos.BRL += valorAporteBRL;

                const ledger = window.myLedger;
                if (ledger) {
                    ledger.addBlock("TESOURARIA GÊNESIS (CAIXA BRL)", sessaoAtual.nome, valorAporteBRL, null, "BRL");
                }

                salvarEstado();
                await window.atualizarUI();
                if (typeof window.renderizarTabelaLedger === 'function') window.renderizarTabelaLedger();
                fecharPopover();
            };

            abrirPopoverUnico("INJETAR CAIXA CORPORATIVO (BRL)", "var(--alt-success)", msgHTML, "CONFIRMAR APORTE BRL", acaoConfirmar);
        }

        window.fecharRelatorioFullWidth = () => {
            const area = document.getElementById('area-relatorio-fullwidth');
            if (area) {
                area.style.display = 'none';
                document.getElementById('relatorio-fullwidth-conteudo').innerHTML = '';
            }
        };

        window.abrirRelatorio = (tipo) => {
            const storage = window.StorageService;
            const usuarios = storage ? storage.getUsers() : (JSON.parse(localStorage.getItem('alt_solution_users')) || []);
            const sessao = JSON.parse(localStorage.getItem('usuario_sessao')) || {};

            if (tipo === 'colaboradores') {
                const isGenesis = sessao.cargo === "Administrador Gênesis" || sessao.hierarchical_level === 0;
                let listaParaExibir = [];

                if (isGenesis) {
                    listaParaExibir = usuarios;
                } else {
                    const proprio = usuarios.find(u => u.wallet === sessao.wallet || u.email === sessao.email);
                    const chefe = usuarios.find(u => u.wallet === (proprio ? proprio.parent_wallet : sessao.parent_wallet));
                    const descendentes = storage ? storage.getDescendantTree(sessao.wallet) : [];

                    if (chefe) listaParaExibir.push(chefe);
                    if (proprio && !listaParaExibir.some(u => u.wallet === proprio.wallet)) listaParaExibir.push(proprio);
                    descendentes.forEach(d => {
                        if (!listaParaExibir.some(u => u.wallet === d.wallet)) listaParaExibir.push(d);
                    });
                }

                let htmlTabela = `
            <div style="overflow-x:auto; overflow-y:auto; max-height:350px; margin-top:10px;">
                <table style="width:100%; border-collapse:collapse; font-size:11px; color:#e2e8f0; min-width: 800px;">
                    <thead>
                        <tr style="border-bottom:2px solid var(--alt-success); color:var(--alt-success); text-align:left;">
                            <th style="padding:10px;">COLABORADOR / E-MAIL</th>
                            <th style="padding:10px;">CARGO</th>
                            <th style="padding:10px;">NÍVEL</th>
                            <th style="padding:10px;">WALLET</th>
                            <th style="padding:10px;">CARTEIRA CHEFE (PARENT)</th>
                            <th style="padding:10px;">DATA / HORA</th>
                        </tr>
                    </thead>
                    <tbody>`;

                listaParaExibir.forEach(u => {
                    htmlTabela += `
                <tr style="border-bottom:1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.1);">
                    <td style="padding:10px;">
                        <div style="font-weight:bold; color:#fff;">${u.nome}</div>
                        <div style="font-size:9px; color:#888;">${u.email}</div>
                    </td>
                    <td style="padding:10px;">${u.cargo || 'Colaborador'}</td>
                    <td style="padding:10px; color:var(--alt-primary); font-weight:bold;">${u.hierarchical_level !== undefined ? u.hierarchical_level : '-'}</td>
                    <td style="padding:10px; font-family:monospace; color:var(--alt-primary);">${u.wallet}</td>
                    <td style="padding:10px; font-family:monospace; color:#888;">${u.parent_wallet || '0x00000000'}</td>
                    <td style="padding:10px;">${u.cadastroEm || '---'}</td>
                </tr>`;
                });

                htmlTabela += `</tbody></table></div>`;

                document.getElementById('relatorio-fullwidth-titulo').innerText = "Cadastro de Colaboradores e Organograma";
                document.getElementById('relatorio-fullwidth-titulo').style.color = "var(--alt-success)";
                document.getElementById('relatorio-fullwidth-conteudo').innerHTML = htmlTabela;
                document.getElementById('area-relatorio-fullwidth').style.display = 'block';
            }
        };

        window.filtrarLedger = (termo) => {
            ledgerSearchQuery = termo;
            ledgerCurrentPage = 1;
            window.renderizarTabelaLedger();
        };

        window.mudarPaginaLedger = (delta) => {
            ledgerCurrentPage += delta;
            window.renderizarTabelaLedger();
        };

        window.abrirRelatorioFinanceiro = () => {
            ledgerCurrentPage = 1;
            ledgerSearchQuery = "";
            document.getElementById('area-relatorio-fullwidth').style.display = 'block';
            document.getElementById('relatorio-fullwidth-titulo').innerText = "Relatório de Movimentação Financeira (Ledger Imutável)";
            document.getElementById('relatorio-fullwidth-titulo').style.color = "var(--alt-primary)";
            window.renderizarTabelaLedger();
        };

        window.renderizarTabelaLedger = () => {
            const ledger = window.myLedger;
            let rawChain = [];

            if (ledger && typeof ledger.getChain === 'function') {
                rawChain = ledger.getChain();
            } else {
                rawChain = JSON.parse(localStorage.getItem('alt_solution_chain')) || [];
            }

            const sessao = JSON.parse(localStorage.getItem('usuario_sessao')) || {};
            const isGenesis = sessao.cargo === "Administrador Gênesis" || sessao.hierarchical_level === 0 || (sessao.email && sessao.email.toLowerCase() === "andre@alts.com");

            const chain = [...rawChain].reverse();

            // Filtro de privacidade flexível e robusto
            const chainComPrivacidade = chain.filter(block => {
                if (isGenesis) return true;
                if (!block.origem || !block.destino) return true; // Mantém blocos de sistema

                const origemStr = block.origem.toLowerCase();
                const destinoStr = block.destino.toLowerCase();
                const userNome = (sessao.nome || "").toLowerCase();
                const userEmail = (sessao.email || "").toLowerCase();
                const userWallet = (sessao.wallet || "").toLowerCase();

                return origemStr.includes(userNome) || origemStr.includes(userEmail) || origemStr.includes(userWallet) ||
                    destinoStr.includes(userNome) || destinoStr.includes(userEmail) || destinoStr.includes(userWallet);
            });

            const filteredChain = chainComPrivacidade.filter(block => {
                if (!ledgerSearchQuery) return true;
                const q = ledgerSearchQuery.toLowerCase();
                const origemMatch = (block.origem || "").toLowerCase().includes(q);
                const destinoMatch = (block.destino || "").toLowerCase().includes(q);
                const hashMatch = (block.hash || "").toLowerCase().includes(q);
                const valorMatch = (block.valor || "").toString().includes(q);
                return origemMatch || destinoMatch || hashMatch || valorMatch;
            });

            const totalPages = Math.ceil(filteredChain.length / ledgerItemsPerPage) || 1;
            if (ledgerCurrentPage < 1) ledgerCurrentPage = 1;
            if (ledgerCurrentPage > totalPages) ledgerCurrentPage = totalPages;

            const start = (ledgerCurrentPage - 1) * ledgerItemsPerPage;
            const pageItems = filteredChain.slice(start, start + ledgerItemsPerPage);

            let htmlTabela = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:10px;">
            <input type="text" placeholder="Filtrar por Origem, Destino, Hash ou Valor..." 
                   value="${ledgerSearchQuery}" 
                   oninput="window.filtrarLedger(this.value)"
                   style="padding:8px 12px; background:var(--alt-bg-input); border:1px solid var(--alt-border); color:#fff; border-radius:6px; font-size:12px; width:60%;">
            <span style="font-size:11px; color:#888;">Total: ${filteredChain.length} registros</span>
        </div>
        <div style="overflow-x:auto; max-height:350px;">
            <table style="width:100%; border-collapse:collapse; font-size:11px; color:#e2e8f0; min-width:800px;">
                <thead>
                    <tr style="border-bottom:2px solid var(--alt-primary); color:var(--alt-primary); text-align:left;">
                        <th style="padding:10px;">ORIGEM (NOME / CARGO)</th>
                        <th style="padding:10px;">HASH DA TRANSAÇÃO (XRPL TESTNET)</th>
                        <th style="padding:10px;">DESTINATÁRIO</th>
                        <th style="padding:10px;">VALOR & MOEDA</th>
                        <th style="padding:10px;">DATA / HORA</th>
                    </tr>
                </thead>
                <tbody>`;

            if (pageItems.length === 0) {
                htmlTabela += `
            <tr>
                <td colspan="5" style="padding:20px; text-align:center; color:#888;">
                    Nenhuma movimentação financeira encontrada para este perfil.
                </td>
            </tr>`;
            } else {
                pageItems.forEach(block => {
                    const isPositive = (block.destino || "").toLowerCase().includes((sessao.nome || "").toLowerCase()) ||
                        (block.destino || "").toLowerCase().includes((sessao.email || "").toLowerCase());
                    const corValor = isPositive ? "var(--alt-success)" : "var(--alt-danger)";
                    const sinal = isPositive ? "+" : "-";

                    let hashCellContent = "";
                    const realHash = block.hash || "";

                    if (realHash && realHash.length > 20 && !realHash.includes('HASH:')) {
                        const truncated = realHash.substring(0, 10) + "..." + realHash.substring(realHash.length - 6);
                        const explorerUrl = `https://testnet.xrpl.org/transactions/${realHash}`;
                        hashCellContent = `
                            <div style="display:flex; align-items:center; gap:8px;">
                                <a href="${explorerUrl}" target="_blank" rel="noopener noreferrer" title="Abrir no XRPL Testnet Explorer" 
                                   style="color:var(--alt-primary); font-family:monospace; font-weight:bold; text-decoration:none;">
                                    ${truncated} <i class="fas fa-external-link-alt" style="font-size:9px;"></i>
                                </a>
                                <button onclick="window.copiarHash('${realHash}', this)" title="Copiar Hash Completo" 
                                        style="background:transparent; border:1px solid var(--alt-border); color:var(--alt-primary); padding:2px 6px; border-radius:4px; cursor:pointer; font-size:10px;">
                                    <i class="fas fa-copy"></i>
                                </button>
                            </div>
                        `;
                    } else {
                        hashCellContent = `<span style="color:var(--alt-text-muted); font-family:monospace; font-size:10px;">[INTERNO / GÊNESIS]</span>`;
                    }

                    const moedaBlock = block.moeda || block.currencySelected || "XRP";
                    const valorNum = parseFloat(block.valor || 0);

                    htmlTabela += `
            <tr style="border-bottom:1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.1);">
                <td style="padding:10px;">
                    <div style="font-weight:bold; color:#fff;">${block.origem || 'Sistema'}</div>
                    <div style="font-size:9px; color:#888;">Protocolo Gênesis</div>
                </td>
                <td style="padding:10px;">${hashCellContent}</td>
                <td style="padding:10px; font-weight:bold; color:#fff;">${block.destino || 'Destino'}</td>
                <td style="padding:10px; font-weight:bold; color:${corValor};">${sinal} ${valorNum.toLocaleString('pt-BR', { minimumFractionDigits: 2 })} ${moedaBlock}</td>
                <td style="padding:10px; color:#888;">${block.timestamp || block.data || new Date().toLocaleString('pt-BR')}</td>
            </tr>`;
                });
            }

            htmlTabela += `</tbody></table></div>`;

            htmlTabela += `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:11px; color:#888;">
            <button onclick="window.mudarPaginaLedger(-1)" ${ledgerCurrentPage === 1 ? 'disabled' : ''} 
                    style="padding:5px 10px; background:#222; color:#fff; border:1px solid #444; border-radius:3px; cursor:pointer;">
                Anterior
            </button>
            <span>Página ${ledgerCurrentPage} de ${totalPages}</span>
            <button onclick="window.mudarPaginaLedger(1)" ${ledgerCurrentPage === totalPages ? 'disabled' : ''} 
                    style="padding:5px 10px; background:#222; color:#fff; border:1px solid #444; border-radius:3px; cursor:pointer;">
                Próxima
            </button>
        </div>`;

            const containerLedger = document.getElementById('relatorio-fullwidth-conteudo');
            if (containerLedger) {
                containerLedger.innerHTML = htmlTabela;
            }
        };

        window.abrirPopOverEstorno = () => {
            const sessaoAcesso = JSON.parse(localStorage.getItem('usuario_sessao'));
            if (!sessaoAcesso) return alert("Erro: Sessão não encontrada.");

            const msgHTML = `
                <div style="display: flex; flex-direction: column; gap: 12px; text-align: left;">
                    <div>
                        <label style="font-size: 0.75rem; color: var(--alt-warning); margin-bottom: 4px;">SELECIONAR ATIVO PARA ESTORNO</label>
                        <select id="estorno-moeda" style="width: 100%; padding: 10px; border: 1px solid var(--alt-border); background: var(--alt-bg-input); color: #fff; border-radius: 6px; font-size: 14px;">
                            <option value="BRL">Caixa BRL (Reais)</option>
                            <option value="XRP">XRP (Nativo)</option>
                            <option value="RLUSD">RLUSD (Dólar)</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-size: 0.75rem; color: var(--alt-warning); margin-bottom: 4px;">MONTANTE A ESTORNAR</label>
                        <input type="number" id="input-valor-estorno" placeholder="0.00" step="any" min="0.01" style="width: 100%; padding: 10px; border: 1px solid var(--alt-border); background: var(--alt-bg-input); color: #fff; border-radius: 6px; font-size: 16px; text-align: center; box-sizing: border-box;">
                    </div>
                </div>
            `;

            const acaoConfirmar = async function () {
                const inputElement = document.getElementById('input-valor-estorno');
                const selectMoeda = document.getElementById('estorno-moeda');
                if (!inputElement || !selectMoeda) return;

                const valorEstorno = parseFloat(inputElement.value);
                const moedaEstorno = selectMoeda.value;
                const sessaoAtual = JSON.parse(localStorage.getItem('usuario_sessao'));

                if (isNaN(valorEstorno) || valorEstorno <= 0) {
                    return alert("Erro: Insira um valor válido maior que zero.");
                }

                if (!sessaoAtual.saldos) sessaoAtual.saldos = { XRP: 0, RLUSD: 0, BRL: 0, caixaBRL: 0 };

                let saldoDisponivel = 0;
                if (moedaEstorno === "BRL") {
                    saldoDisponivel = sessaoAtual.saldos.caixaBRL !== undefined ? sessaoAtual.saldos.caixaBRL : sessaoAtual.saldos.BRL;
                } else if (moedaEstorno === "XRP") {
                    saldoDisponivel = sessaoAtual.saldos.XRP || sessaoAtual.saldo || 0;
                } else if (moedaEstorno === "RLUSD") {
                    saldoDisponivel = sessaoAtual.saldos.RLUSD || 0;
                }

                if (valorEstorno > saldoDisponivel) {
                    return alert(`Erro de Saldo: O valor de estorno (${valorEstorno} ${moedaEstorno}) excede o saldo disponível (${saldoDisponivel} ${moedaEstorno}).`);
                }

                // Debita o saldo conforme a moeda estornada
                if (moedaEstorno === "BRL") {
                    if (sessaoAtual.saldos.caixaBRL !== undefined) sessaoAtual.saldos.caixaBRL = Math.max(0, sessaoAtual.saldos.caixaBRL - valorEstorno);
                    sessaoAtual.saldos.BRL = Math.max(0, sessaoAtual.saldos.BRL - valorEstorno);
                } else if (moedaEstorno === "XRP") {
                    sessaoAtual.saldos.XRP = Math.max(0, sessaoAtual.saldos.XRP - valorEstorno);
                    sessaoAtual.saldo = sessaoAtual.saldos.XRP;
                    appState.admin.saldo = sessaoAtual.saldos.XRP;
                } else if (moedaEstorno === "RLUSD") {
                    sessaoAtual.saldos.RLUSD = Math.max(0, sessaoAtual.saldos.RLUSD - valorEstorno);
                }

                localStorage.setItem('usuario_sessao', JSON.stringify(sessaoAtual));
                appState.admin.saldos = sessaoAtual.saldos;

                const ledger = window.myLedger;
                if (ledger && typeof ledger.addBlock === 'function') {
                    ledger.addBlock(sessaoAtual.nome, "TESOURARIA GÊNESIS (ESTORNO)", valorEstorno, null, moedaEstorno);
                }

                salvarEstado();
                await window.atualizarUI();
                if (typeof window.renderizarTabelaLedger === 'function') window.renderizarTabelaLedger();
                fecharPopover();
            };

            abrirPopoverUnico("SOLICITAR ESTORNO DE RECURSO", "var(--alt-warning)", msgHTML, "CONFIRMAR ESTORNO", acaoConfirmar);
        };

        window.assinarTransacao = async () => {
            const destWallet = document.getElementById('send-dest').value;
            const valorInput = document.getElementById('send-valor').value;
            const currencySelected = document.getElementById('send-currency').value;
            const valor = parseFloat(valorInput);
            const emailSig = document.getElementById('sign-email').value.trim();
            const passSig = document.getElementById('sign-pass').value.trim();

            const sessaoAtiva = JSON.parse(localStorage.getItem('usuario_sessao'));

            if (!sessaoAtiva) {
                alert("Sessão não encontrada. Faça o login novamente.");
                return;
            }

            if (emailSig.toLowerCase() !== sessaoAtiva.email.toLowerCase() || passSig !== sessaoAtiva.pin) {
                abrirPopoverUnico("ASSINATURA INVÁLIDA", "var(--alt-danger)", '<p style="text-align:center;">Os dados de assinatura (E-mail ou PIN) não conferem com a sessão atual.</p>', "TENTAR NOVAMENTE", fecharPopover);
                return;
            }

            if (!destWallet || isNaN(valor) || valor <= 0) {
                abrirPopoverUnico("ERRO DE OPERAÇÃO", "var(--alt-warning)", "Verifique o destinatário e o valor digitado.", "CORRIGIR DADOS", fecharPopover);
                return;
            }

            const btnAssinar = document.getElementById('btn-assinar');
            if (btnAssinar) {
                btnAssinar.disabled = true;
                btnAssinar.innerText = "TRANSMITINDO PARA A XRPL...";
            }

            try {
                const storage = window.StorageService;
                const todosUsuarios = storage ? storage.getUsers() : (JSON.parse(localStorage.getItem('alt_solution_users')) || []);
                const remetenteObj = todosUsuarios.find(u => u.email === sessaoAtiva.email || u.wallet === sessaoAtiva.wallet) || sessaoAtiva;
                const destIndex = todosUsuarios.findIndex(c => c.wallet === destWallet);
                const destinatarioObj = todosUsuarios[destIndex] || { nome: destWallet, wallet: destWallet };

                let realTxHash = null;
                const walletSvc = window.WalletService;
                const xrplSvc = window.XRPLService;

                if (walletSvc && xrplSvc && remetenteObj.cipherSeed) {
                    const senderWallet = walletSvc.getWalletFromCipher(remetenteObj.cipherSeed, passSig);

                    if (!senderWallet) {
                        abrirPopoverUnico("PIN INCORRETO", "var(--alt-danger)", "<p style='text-align:center;'>Não foi possível descriptografar a carteira. Verifique o PIN.</p>", "TENTAR NOVAMENTE", fecharPopover);
                        if (btnAssinar) {
                            btnAssinar.disabled = false;
                            btnAssinar.innerText = "ASSINAR TRANSAÇÃO";
                        }
                        return;
                    }

                    // Tentativa resiliente de consulta on-chain com fallback para evitar falha por "Account not found"
                    let saldoDisponivelMoeda = 100; // Fallback seguro inicial para contas recém-financiadas pelo Faucet
                    try {
                        if (currencySelected === "XRP" || currencySelected === "BRL") {
                            const accData = await xrplSvc.getAccountInfo(senderWallet.address);
                            if (accData && accData.Balance) {
                                saldoDisponivelMoeda = parseFloat(accData.Balance) / 1000000;
                            }
                        } else if (currencySelected === "RLUSD") {
                            const lines = await xrplSvc.getAccountLines(senderWallet.address);
                            const rlusdLine = lines.find(l => l.currency === "RLUSD");
                            if (rlusdLine) saldoDisponivelMoeda = parseFloat(rlusdLine.balance);
                        }
                    } catch (accErr) {
                        console.warn("Aviso: Conta ainda em indexação no nó Testnet, utilizando saldo local de referência:", accErr);
                        saldoDisponivelMoeda = remetenteObj.saldos ? remetenteObj.saldos.XRP : (remetenteObj.saldo || 100);
                    }

                    const valorEmMoedaReal = (currencySelected === "BRL") ? (valor / 3.0) : valor;
                    const moedaEnvioXRPL = (currencySelected === "BRL") ? "XRP" : currencySelected;

                    if (valorEmMoedaReal > saldoDisponivelMoeda) {
                        abrirPopoverUnico(
                            "SALDO ON-CHAIN INSUFICIENTE",
                            "var(--alt-warning)",
                            `<div style="text-align:center;">
                                <p style="margin-bottom:8px;">O valor solicitado excede o saldo disponível na XRPL Testnet.</p>
                                <p style="font-size:0.85rem; color:var(--alt-primary);">Saldo Disponível em ${moedaEnvioXRPL}: <strong>${saldoDisponivelMoeda.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</strong></p>
                            </div>`,
                            "ENTENDIDO",
                            fecharPopover
                        );
                        if (btnAssinar) {
                            btnAssinar.disabled = false;
                            btnAssinar.innerText = "ASSINAR TRANSAÇÃO";
                        }
                        return;
                    }

                    console.log(`Enviando ${valorEmMoedaReal} ${moedaEnvioXRPL} na XRPL Testnet...`);
                    const paymentRes = await xrplSvc.sendPayment(senderWallet, destWallet, valorEmMoedaReal, moedaEnvioXRPL);

                    if (paymentRes && paymentRes.hash) {
                        realTxHash = paymentRes.hash;
                        console.log("Transação confirmada na XRPL Testnet! Hash:", realTxHash);
                    }
                }

                // Gravação atômica no Ledger e atualização imediata da interface
                const ledger = window.myLedger;
                if (ledger && typeof ledger.addBlock === 'function') {
                    ledger.addBlock(sessaoAtiva.nome, destinatarioObj.nome || destWallet, valor, realTxHash, currencySelected);
                }

                if (typeof salvarEstado === 'function') salvarEstado();
                if (typeof window.atualizarUI === 'function') await window.atualizarUI();
                if (typeof window.renderizarTabelaLedger === 'function') window.renderizarTabelaLedger();

                const truncatedHash = realTxHash ? (realTxHash.substring(0, 10) + "..." + realTxHash.substring(realTxHash.length - 6)) : "";
                const explorerUrl = realTxHash ? `https://testnet.xrpl.org/transactions/${realTxHash}` : "#";

                const msgSucesso = `
                    <div style="text-align: center;">
                        <p>Envio de <strong>${valor.toLocaleString('pt-BR', { minimumFractionDigits: 2 })} ${currencySelected}</strong> realizado com sucesso!</p>
                        <p style="font-size: 0.8rem; color: #888;">Destino: ${destinatarioObj.nome || destWallet}</p>
                        <p style="font-size: 0.75rem; font-family: monospace; color: var(--alt-primary);">Wallet: ${destWallet}</p>
                        ${realTxHash ? `
                        <div style="margin-top: 12px; padding: 12px; background: rgba(33,212,253,0.1); border: 1px solid var(--alt-border); border-radius: 8px;">
                            <p style="font-size: 0.7rem; color: #888; margin-bottom: 4px;">HASH DA TRANSAÇÃO (XRPL TESTNET):</p>
                            <a href="${explorerUrl}" target="_blank" rel="noopener noreferrer" style="color: var(--alt-primary); font-family: monospace; font-size: 0.85rem; font-weight: bold; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
                                ${truncatedHash} <i class="fas fa-external-link-alt"></i>
                            </a>
                        </div>
                        ` : ''}
                    </div>
                `;

                abrirPopoverUnico("TRANSAÇÃO CONCLUÍDA", "var(--alt-success)", msgSucesso, "CONCLUIR", fecharPopover);

                document.getElementById('send-valor').value = "";
                document.getElementById('sign-pass').value = "";
            } catch (err) {
                console.error("Erro no pagamento on-chain:", err);
                abrirPopoverUnico("FALHA NA TRANSAÇÃO XRPL", "var(--alt-danger)", `<p style="text-align:center;">Não foi possível transmitir a transação: ${err.message || 'Erro de conexão.'}</p>`, "ENTENDIDO", fecharPopover);
            } finally {
                if (btnAssinar) {
                    btnAssinar.disabled = false;
                    btnAssinar.innerText = "ASSINAR TRANSAÇÃO";
                }
            }
        };

        function resetGenesis() {
            const sessaoSeguranca = JSON.parse(localStorage.getItem('usuario_sessao'));
            if (!sessaoSeguranca || sessaoSeguranca.cargo !== "Administrador Gênesis") {
                alert("Acesso Negado: Operação restrita ao Administrador.");
                return;
            }

            const confirmado = window.confirm("CONFIRMAR RESET TOTAL\n\nEsta ação é irreversível.\n\nO banco de dados local e a blockchain serão apagados e a página reiniciada.");

            if (confirmado) {
                localStorage.removeItem('alt_solution_users');
                localStorage.removeItem('genesis_state');
                localStorage.removeItem('usuario_sessao');

                const ledger = window.myLedger;
                if (ledger && typeof ledger.clearLedger === 'function') {
                    ledger.clearLedger();
                }

                appState.transacoes = [];
                appState.admin.saldo = 0;

                localStorage.setItem('genesis_state', JSON.stringify(appState));

                if (window.fecharRelatorioFullWidth) {
                    window.fecharRelatorioFullWidth();
                }
                window.location.reload();
            }
        }

        function encerrarSessao() {
            localStorage.removeItem('usuario_sessao');
            window.location.replace('index.html');
        }
    </script>
</body>

</html>
