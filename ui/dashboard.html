<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambiente Gênesis - Dashboard Corporativo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #020408;
            /* Mais profundo para destacar o neon */
            --card-bg: rgba(23, 28, 35, 0.0);
            /* Mais transparente para o Glass */
            --secondary: #21d4fd;
            --secondary-glow: rgba(33, 212, 253, 0.4);
            --success: #00ff88;
            --success-glow: rgba(0, 255, 136, 0.3);
            --error: #ff5252;
            --text: #e2e8f0;
            --border: rgba(33, 212, 253, 0.04);
            --neon-gradient: linear-gradient(90deg, #21d4fd, #00ff88);
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 80px 80px;
            /* Grade estilo Sci-Fi */
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .main-container {
            width: 100%;
            max-width: 1280px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header / Container Horizontal */
        .header-genesis {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(0px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border) !important;
            position: relative;
            overflow: hidden;
        }

        /* Linha de luz no topo do header */
        .header-genesis::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--neon-gradient);
            box-shadow: 0 0 15px var(--secondary-glow);
        }

        .user-info h2 {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .user-details {
            font-size: 0.85rem;
            color: #888;
        }

        .balance-info {
            text-align: right;
        }

        .balance-label {
            font-size: 0.7rem;
            color: var(--secondary);
            display: block;
        }

        .balance-value {
            font-size: 1.8rem;
            margin: 5px 0;
            font-weight: bold;
        }

        /* Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(23, 28, 35, 0.0) !important;
            backdrop-filter: blur(0px) saturate(180%) !important;
            border: 1px solid rgba(33, 212, 253, 0.25) !important;
            border-radius: 20px !important;
            padding: 25px !important;
            transition: all 0.3s ease;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6) !important;
        }

        .card:hover {
            border-color: var(--secondary) !important;
            box-shadow: 0 0 20px rgba(33, 212, 253, 0.15) !important;
            transform: translateY(-2px);
        }

        .card h3 {
            margin-top: 0;
            font-size: 1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            color: var(--secondary);
        }

        /* Inputs e Botões */
        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            margin-bottom: 5px;
            color: #aaa;
        }

        input,
        select {
            width: 100% !important;
            padding: 12px !important;
            background: rgba(0, 0, 0, 0.4) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 8px !important;
            color: var(--text) !important;
            font-family: 'Rajdhani', sans-serif !important;
            font-size: 0.95rem !important;
            transition: 0.3s !important;
        }

        input:focus,
        select:focus {
            border-color: var(--secondary) !important;
            box-shadow: 0 0 10px var(--secondary-glow) !important;
            background: rgba(0, 0, 0, 0.6) !important;
        }

        .btn {
            font-family: 'Orbitron', sans-serif !important;
            letter-spacing: 1px !important;
            text-transform: uppercase !important;
            border-radius: 8px !important;
            font-weight: 700 !important;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
        }

        .btn-success {
            background: linear-gradient(45deg, #00ff88, #00d4ff) !important;
            color: #020408 !important;
            box-shadow: 0 0 15px var(--success-glow) !important;
        }

        .btn-success {
            background: linear-gradient(45deg, #00ff88, #00d4ff) !important;
            color: #020408 !important;
            box-shadow: 0 0 15px var(--success-glow) !important;
        }

        .btn:hover {
            filter: brightness(1.2) !important;
            letter-spacing: 2px !important;
            box-shadow: 0 0 30px var(--secondary-glow) !important;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--secondary);
            color: var(--secondary);
            margin-top: 5px;
        }

        .btn-logout {
            background: var(--error);
            color: white;
            width: auto;
            padding: 5px 10px;
            font-size: 0.7rem;
        }

        /* Pop-over */
        /* ESTA REGRA É O QUE RESOLVE O SEU PROBLEMA */
        .popover-overlay {
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(2, 4, 8, 0.85) !important;
            /* Fundo mais denso para foco */
            backdrop-filter: blur(12px) !important;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999 !important;
        }

        .popover-content {
            background: rgba(15, 20, 30, 0.75) !important;
            backdrop-filter: blur(25px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--secondary) !important;
            border-radius: 20px !important;
            padding: 35px !important;
            max-width: 850px !important;
            width: 92%;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 15px var(--secondary-glow) !important;
            position: relative;
            color: var(--text) !important;
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Título e Texto Interno */
        #popover-title {
            font-family: 'Orbitron', sans-serif !important;
            font-size: 1.4rem !important;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-shadow: 0 0 10px var(--secondary-glow);
        }

        /* Efeito de desfoque para o saldo */
        .blur-effect {
            filter: blur(8px);
            transition: 0.3s;
        }

        /* Brilho do saldo quando ativo */
        .balance-glow {
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
            color: var(--success) !important;
        }

        /* Botões de ação do header */
        .header-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .btn-small {
            padding: 5px 10px;
            font-size: 0.75rem;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 33px;
        }

        /* Tabelas */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        th {
            text-align: left;
            color: var(--secondary);
            padding: 10px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 768px) {
            .header-genesis {
                flex-direction: column;
                text-align: center;
            }

            .balance-info {
                text-align: center;
            }
        }

        /* Animação de Surgimento */
        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(15px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes pulse-neon {
            0% {
                box-shadow: 0 0 5px var(--success-glow);
            }

            50% {
                box-shadow: 0 0 20px var(--success-glow);
            }

            100% {
                box-shadow: 0 0 5px var(--success-glow);
            }
        }

        .balance-glow {
            animation: pulse-neon 2s infinite ease-in-out;
            border-radius: 50px;
            padding: 2px 30px;
        }
    </style>
</head>

<body>

                // --- MANUTENÇÃO DOS CAMPOS ATUAIS ---
                document.getElementById('user-fullname').innerText = loggedUser.nome;
                document.getElementById('header-wallet').innerText = loggedUser.wallet;
                document.getElementById('header-email').innerText = loggedUser.email;
                // --- INJEÇÃO CIRÚRGICA: IDENTIDADE DO AMBIENTE (ETAPA 1) ---
                const headerTitle = document.getElementById('header-title');
                if (headerTitle) {
                    if (loggedUser.cargo !== "Administrador Gênesis") {
                        headerTitle.firstChild.textContent = "Ambiente Colaborador - ";
                    } else {
                        headerTitle.firstChild.textContent = "Ambiente Gênesis - ";
                    }
                }
                // --- NOVO BLOCO: INSERIR APÓS A LINHA 577 ---
                // --- REPARO CIRÚRGICO: PRIVILÉGIOS DE ACESSO (ETAPA 2) ---
                const btnInjetar = document.getElementById('btn-injetar');
                const btnReset = document.getElementById('btn-reset');

                if (loggedUser.cargo !== "Administrador Gênesis") {
                    if (btnInjetar) btnInjetar.style.display = 'none';
                    if (btnReset) btnReset.style.display = 'none';
                } else {
                    if (btnInjetar) btnInjetar.style.display = 'inline-block';
                    if (btnReset) btnReset.style.display = 'inline-block';
                }
                // --- FIM DA INSERÇÃO ---
                // --- INJEÇÃO DOS NOVOS CAMPOS DINÂMICOS (VERSÃO RESILIENTE) ---
                const campoPosto = document.getElementById('header-posto');
                const campoOrigem = document.getElementById('header-origem');
                if (campoPosto) {
                    // Tenta ler 'cargo' ou 'posto' do usuário logado. Se for undefined, define como 'Colaborador'
                    campoPosto.innerText = loggedUser.cargo || loggedUser.posto || "Colaborador";
                }
                if (campoOrigem) {
                    // Tenta ler 'origem' ou 'setor'. Se não existir, aplica a lógica de domínio do e-mail
                    const origemSugerida = loggedUser.email.includes('alt.com') ? "Raiz (Gênesis)" : "Rede";
                    campoOrigem.innerText = loggedUser.origem || loggedUser.setor || origemSugerida;
                }
                // --- SUA LÓGICA DE AUDITORIA PERMANECE INTACTA ---
                let usuariosDaRede = JSON.parse(localStorage.getItem('alt_solution_users')) || [];
                const jaExiste = usuariosDaRede.some(u => u.wallet === loggedUser.wallet);
                if (!jaExiste) {
                    usuariosDaRede.push({
                        ...loggedUser,
                        origem: loggedUser.email.includes('alts.com') ? "Raiz" : "Rede",
                        cadastroEm: new Date().toLocaleString('pt-BR')
                    });
                    localStorage.setItem('alt_solution_users', JSON.stringify(usuariosDaRede));
                }
            } else {
                window.location.replace('index.html');
            }
        } catch (error) {
            console.error("Erro Crítico de Inicialização:", error);
        }
        const saved = localStorage.getItem('genesis_state');
        if (saved) appState = JSON.parse(saved);
        atualizarUI();
    };
    // --- REPARO CIRÚRGICO: PERSISTÊNCIA SINCRONIZADA ---
    function salvarEstado() {
        // 1. Salva no Estado Local do Dashboard (Gráficos e Fluxo Interno)
        localStorage.setItem('genesis_state', JSON.stringify(appState));

        // 2. SINCRONIZAÇÃO COERENTE COM O BANCO CENTRAL (alt_solution_users)
        let usuariosGerais = JSON.parse(localStorage.getItem('alt_solution_users')) || [];

        // Sincroniza os dados do Administrador ativo
        const indexAdmin = usuariosGerais.findIndex(u => u.wallet === appState.admin.wallet);
        if (indexAdmin !== -1) {
            usuariosGerais[indexAdmin].saldo = appState.admin.saldo;
            usuariosGerais[indexAdmin].saldoTotal = appState.admin.saldo;
        }

        // Sincroniza a lista de colaboradores mutada localmente
        if (appState.colaboradores && appState.colaboradores.length > 0) {
            appState.colaboradores.forEach(colabLocal => {
                const indexColab = usuariosGerais.findIndex(u => u.wallet === colabLocal.wallet);
                if (indexColab !== -1) {
                    usuariosGerais[indexColab].saldo = colabLocal.saldo;
                }
            });
        }

        // Grava de forma definitiva na chave consumida pelo ecossistema
        localStorage.setItem('alt_solution_users', JSON.stringify(usuariosGerais));
    }

    function cadastrarColaborador() {
        const inputNome = document.getElementById('cad-nome');
        const inputEmail = document.getElementById('cad-email');
        const inputSenha = document.getElementById('cad-pass'); // Alvo corrigido para Senha
        const visorPin = document.getElementById('pin-display-screen'); // Alvo corrigido para o Visor
        if (!inputNome || !inputEmail || !inputSenha || !visorPin) {
            console.error("Erro de QA: Elementos de input ou visor não encontrados.");
            return;
        }
        const nome = inputNome.value.trim();
        const email = inputEmail.value.trim();
        const senha = inputSenha.value; // Captura a senha alfanumérica (Ex: Alt@2026)
        const pin = visorPin.innerText; // Captura os 6 dígitos que geramos no visor
        const cargo = document.getElementById('mat-cargo').value;
        const wallet = document.getElementById('cad-wallet').value;
        // Validação estrita: O PIN não pode ser o valor padrão "------"
        if (!nome || !email || !senha || pin === "------") {
            alert("Andre, preencha Nome, E-mail, Senha e Gere um PIN para realizar o registro.");
            return;
        }
        const agora = new Date();
        const dataFormatada = agora.toLocaleDateString('pt-BR') + " " + agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        // --- OBJETO UNIFICADO CORRIGIDO ---
        const novoColaborador = {
            nome: nome,
            cargo: cargo,
            email: email.toLowerCase(),
            senha: senha,        // Senha para Login (index.html)
            pin: pin,            // PIN para Transações (Dashboard)
            wallet: wallet,
            origem: "Gênesis (Admin)",
            saldoTotal: 0,
            historico: [],
            cadastroEm: dataFormatada,
            primeiroAcesso: true
        };
        // --- FIM DO REPARO CIRÚRGICO ---
        // 1. Persistência no Estado Local (Mantém seus gráficos vivos)
        if (typeof appState !== 'undefined' && appState.colaboradores) {
            appState.colaboradores.push(novoColaborador);
            salvarEstado();
        }
        // 2. Persistência no Banco Central (Permite o Login via index.html)
        let listaUsuarios = JSON.parse(localStorage.getItem('alt_solution_users')) || [];
        // Evita duplicidade de e-mail na rede
        if (listaUsuarios.some(u => u.email === novoColaborador.email)) {
            alert("Este e-mail já está integrado à rede ALT.");
            return;
        }
        listaUsuarios.push(novoColaborador);
        localStorage.setItem('alt_solution_users', JSON.stringify(listaUsuarios));
        // REPARO DE SINCRONIZAÇÃO: Atualiza a lista global para o relatório ler os dados novos sem refresh
        if (typeof appState !== 'undefined') appState.colaboradores = listaUsuarios;
        // 3. Feedback Visual (Mantendo seu padrão original)
        document.getElementById('popover-title').innerText = "CADASTRO REALIZADO";
        document.getElementById('popover-title').style.color = "var(--success)";
        document.getElementById('popover-msg').innerHTML = `
            <p>O colaborador <strong>${nome}</strong> foi integrado à rede.</p>
            <p>Wallet: <span style="color:var(--secondary)">${wallet}</span></p>
            <p>PIN de Acesso: <strong style="color:var(--success)">${pin}</strong></p>
        `;
        const btnAcao = document.getElementById('popover-main-btn');
        btnAcao.innerText = "FECHAR";
        btnAcao.style.display = "block";
        btnAcao.onclick = function () { fecharPopover(); };
        document.getElementById('popover').style.display = 'flex';
        // Limpeza dos campos
        inputNome.value = "";
        inputEmail.value = "";
        // 4. Sincronização de Interface (Mantendo seu fluxo)
        if (typeof carregarTabelaAuditoria === "function") carregarTabelaAuditoria();
        if (typeof atualizarDestinatarios === "function") atualizarDestinatarios();
    }

    // 2. Função de Assinatura e Envio
    function assinarTransacao() {
        const destWallet = document.getElementById('send-dest').value;
        const valorInput = document.getElementById('send-valor').value;
        const valor = parseFloat(valorInput);
        const emailSig = document.getElementById('sign-email').value;
        const passSig = document.getElementById('sign-pass').value;
        // --- REPARO CIRÚRGICO DA ASSINATURA ---
        const sessaoAtiva = JSON.parse(localStorage.getItem('usuario_sessao'));
        // 1. Validação de Identidade (Substituindo Alert por Pop-over)
        if (emailSig !== sessaoAtiva.email || passSig !== sessaoAtiva.pin) {
            const popover = document.getElementById('popover');
            document.getElementById('popover-title').innerText = "ASSINATURA INVÁLIDA";
            document.getElementById('popover-title').style.color = "#ff4d4d"; // Vermelho de erro
            document.getElementById('popover-msg').innerHTML = `
                <p style="text-align:center;">Andre, os dados de assinatura não conferem.</p>
                <p style="font-size:10px; color:#888; margin-top:10px;">Verifique se utilizou seu e-mail oficial: <b>${sessaoAtiva.email}</b></p>
            `;
            document.getElementById('popover-main-btn').style.display = "block";
            document.getElementById('popover-main-btn').innerText = "TENTAR NOVAMENTE";
            popover.style.display = 'flex';
            return; // Interrompe a execução
        }
        // 2. Validação Financeira
        if (!destWallet || isNaN(valor) || valor <= 0 || valor > appState.admin.saldo) {
            const popover = document.getElementById('popover');
            document.getElementById('popover-title').innerText = "ERRO DE OPERAÇÃO";
            document.getElementById('popover-title').style.color = "#ffb86c"; // Laranja de atenção
            document.getElementById('popover-msg').innerHTML = "Verifique o destinatário, o valor digitado ou se há saldo disponível.";
            document.getElementById('popover-main-btn').style.display = "block";
            document.getElementById('popover-main-btn').innerText = "CORRIGIR DADOS";
            popover.style.display = 'flex';
            return;
        }
        // Insira antes de const destinatario = ...
        appState.colaboradores = JSON.parse(localStorage.getItem('alt_solution_users')) || [];
        const destinatario = appState.colaboradores.find(c => c.wallet === destWallet);
        // Registro do Ledger (Movimentação)
        const novaTransacao = {
            origemNome: appState.admin.nome,
            origemCargo: appState.admin.cargo,
            origemEmail: appState.admin.email,
            origemWallet: appState.admin.wallet,
            destinoNome: destinatario.nome,
            destinoWallet: destWallet,
            valor: valor,
            data: new Date().toLocaleString('pt-BR')
        };
        // Processamento de Débito
        appState.admin.saldo -= valor;
        // Inicializa o array de transações caso ele não exista (Segurança contra erro de reset)
        // Substitua a lógica de push e salvarEstado() por:
        if (typeof myLedger !== 'undefined') {
            myLedger.addBlock(appState.admin.nome, destinatario.nome, valor);
        }
        salvarEstado();
        atualizarUI();
        // Feedback de Sucesso
        document.getElementById('popover-title').innerText = "TRANSAÇÃO CONCLUÍDA";
        document.getElementById('popover-title').style.color = "var(--success)";
        document.getElementById('popover-msg').innerHTML = `
        <div style="text-align: center;">
            <p>Envio de <strong>R$ ${valor.toLocaleString('pt-BR')}</strong> realizado!</p>
            <p style="font-size: 0.8rem; color: #888;">Destino: ${destinatario.nome}</p>
        </div>
    `;
        const btnAcao = document.getElementById('popover-main-btn');
        btnAcao.innerText = "CONCLUIR";
        btnAcao.onclick = fecharPopover;
        document.getElementById('popover').style.display = 'flex';
        // Limpeza de campos de segurança
        document.getElementById('send-valor').value = "";
        document.getElementById('sign-pass').value = "";
    }

    // --- FINALIZAÇÃO: REPARO DO RESET (OTIMIZADO E DESACOPLADO) ---
    function resetGenesis() {
        const sessaoSeguranca = JSON.parse(localStorage.getItem('usuario_sessao'));
        if (!sessaoSeguranca || sessaoSeguranca.cargo !== "Administrador Gênesis") {
            alert("Acesso Negado: Operação restrita ao Administrador.");
            return;
        }

        // Validação de segurança utilizando a API nativa do navegador
        const confirmado = window.confirm("CONFIRMAR RESET TOTAL\n\nEsta ação é irreversível.\n\nO banco de dados local será apagado e a página reiniciada. Deseja continuar?");

        if (confirmado) {
            // 1. Purga do Banco de Dados Local (Storage)
            localStorage.removeItem('alt_solution_users');
            localStorage.removeItem('genesis_state');
            localStorage.removeItem('usuario_sessao');

            // 2. Limpeza profunda da RAM (Módulo Ledger e Estado)
            if (window.myLedger && typeof window.myLedger.clearAll === 'function') { window.myLedger.clearAll(); }
            if (window.myLedger && window.myLedger.chain) { window.myLedger.chain = []; }
            appState.transacoes = [];
            appState.admin.saldo = 0;
            
            // 3. Persistência do Estado Base Limpo antes de descarregar a página
            localStorage.setItem('genesis_state', JSON.stringify(appState));

            // 4. Limpeza Visual e Disparo do Recarregamento (Último passo)
            if (window.fecharRelatorioFullWidth) { window.fecharRelatorioFullWidth(); }
            window.location.reload();
        }

    }
    // --- SOLUÇÃO PROBLEMA 1: LOGOUT ---
    function encerrarSessao() {
        // 1. Limpa a chave de sessão para impedir acesso sem login
        localStorage.removeItem('usuario_sessao');
        // 2. Redireciona para a tela inicial
        // Usamos replace para que o usuário não consiga voltar com a seta do navegador
        window.location.replace('index.html');
    }
</script>
