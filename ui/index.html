<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALT Solution - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --neon-blue: #21d4fd;
            --neon-green: #00ff88;
            --glass-bg: rgba(23, 28, 35, 0.00);
            /* Mais transparente para o vidro */
            --glass-border: rgba(33, 212, 253, 0.25);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #06090f;
            /* Grid Tecnológico Sci-Fi */
            background-image:
                linear-gradient(rgba(33, 212, 253, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(33, 212, 253, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #e2e8f0;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }
        /* EFEITO GLASSMORPHISM NO CONTAINER */
        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(0.0);
            /* O segredo do vidro fosco */
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 40px 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(33, 212, 253, 0.1);
            position: relative;
        }
        /* STATUS LIGHT COM MAIOR BRILHO */
        .status-light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transition: 0.3s;
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .light-red {
            background: #ff5252;
            box-shadow: 0 0 15px #ff5252;
        }
        .light-green {
            background: var(--neon-green);
            box-shadow: 0 0 20px var(--neon-green);
        }
        .input-container {
            position: relative;
            margin-bottom: 15px;
        }
        .input-container input {
            width: 100%;
            padding: 12px 40px;
            background: rgba(0, 0, 0, 0.3);
            /* Mais escuro para contraste no vidro */
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            color: white;
            outline: none;
            transition: 0.3s;
        }
        .input-container input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(33, 212, 253, 0.2);
        }
        .icon-left {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-blue);
        }
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            cursor: pointer;
        }
        .btn-inactive {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            background: #1a1d23;
            color: #555;
            cursor: not-allowed;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-weight: bold;
        }
        /* BOTÃO NEON ATIVO */
        .btn-active {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            background: linear-gradient(135deg, #3f5efb, var(--neon-blue));
            color: white;
            cursor: pointer;
            border: none;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(63, 94, 251, 0.4);
            transition: 0.3s;
        }
        .btn-active:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(33, 212, 253, 0.5);
        }
        .toast {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff5252;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.5s;
            z-index: 9999;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .toast.show {
            top: 30px;
        }
    </style>
</head>

<body>
<!--Esta linha abre a região principal do site. Tudo o que for colocado daqui para a frente 
será desenhado e exibido de forma visível na janela do navegador para quem estiver acessando o sistema.-->    
    
<div id="error-toast" class="toast">Acesso Negado! Credenciais inválidas.</div>
    <!--Esta linha cria uma caixa de texto que exibe o aviso "Acesso Negado!". O elemento 'div' serve para criar blocos na tela. 
    O atributo id="error-toast" funciona como o "RG exclusivo" dessa caixinha para que o sistema a encontre depois. 
    A propriedade class="toast" aplica regras visuais para deixá-la flutuando no topo do site como um balão de alerta.-->
    
    <div class="container">
    <!--Esta linha abre uma grande caixa invisível que serve para organizar o site. 
    A palavra class="container" indica que este bloco vai seguir o padrão visual de limitar a largura máxima da tela, 
    centralizando todo o formulário de login para que ele não fique espalhado pelas bordas.-->    
        
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
        <!--Esta linha cria o cabeçalho no topo da página. A tag header avisa ao navegador que este pedaço é o topo do site. 
        O comando style="..." configura as regras de design: o display: flex alinha os itens lado a lado; 
        o justify-content: space-between joga o texto para a esquerda e a luz indicadora para a direita; 
        o align-items: center deixa tudo alinhado na mesma altura do meio; 
        e o margin-bottom: 25px cria um espaço vazio abaixo deles para empurrar o resto do conteúdo para baixo.-->    
            
            <div>
            <!--Esta linha abre uma pequena caixinha interna usada apenas para agrupar as duas linhas de texto que virão a seguir, garantindo que o título e o subtítulo fiquem grudados e se movam juntos.-->                
                
                <h2 style="font-size: 1.5rem;">Acesso a Rede</h2>
                <!--Esta linha exibe o título principal da tela "Acesso a Rede". A tag h2 define que o texto é um título de destaque e a propriedade style="font-size: 1.5rem;" configura o tamanho exato da letra.-->
                
                <p style="color: #888; font-size: 0.8rem;">ALT Solution - Assets Liquidity & Treasury</p>
                <!--Esta linha exibe o subtítulo descritivo com o nome completo da corporação. A tag 'p' cria um bloco de parágrafo de texto comum, enquanto o estilo color: #888 deixa a cor da letra num tom cinza discreto e o font-size: 0.8rem diminui o tamanho do texto para ficar menor que o título.-->
            
            </div>
            <!--Esta linha fecha a caixinha interna que estava agrupando os textos. Tudo o que for criado a partir daqui não fará mais parte do bloco de títulos do cabeçalho.-->

            <div id="status-light" class="status-light light-red"></div>
            <!--Esta linha cria a bolinha indicadora de status de conexão na tela. O atributo id="status-light" dá um nome exclusivo para essa bolinha para que o programador consiga mudar a cor dela via código. A classe status-light desenha a bolinha redonda na tela e a classe light-red pinta ela de vermelho, indicando que o sistema começa desconectado da rede.-->
        
        </header>
        <!--Esta linha fecha o bloco do cabeçalho do site. Toda a estrutura do topo da página está concluída.-->

        <div class="input-container">
        <!--Esta linha abre uma caixinha para organizar uma linha de entrada de dados. A classe input-container aplica regras visuais para garantir que o campo de texto e o ícone fiquem bem posicionados e organizados juntos.-->

            <i class="fa-solid fa-envelope icon-left"></i>
            <!--Esta linha desenha um pequeno desenho de envelope na tela. A tag 'i' serve para inserir ícones, e as classes 'fa-solid fa-envelope' escolhem a imagem do envelope, enquanto a classe 'icon-left' joga esse desenho para o lado esquerdo do campo.-->

            <input type="email" id="l-email" placeholder="E-mail de acesso">
            <!--Esta linha cria o campo onde o usuário digita o e-mail. A tag input gera campos de preenchimento, o atributo type="email" garante que o navegador valide se o texto digitado possui uma estrutura com "@" e ponto, o id="l-email" dá o nome único para a lógica JavaScript ler o que foi escrito, e o placeholder="..." define a frase instrutiva em cinza que desaparece ao digitar.-->

        </div>
        <!--Esta linha fecha a primeira caixinha de entrada de dados. Tudo o que for digitado abaixo fará parte de um novo bloco.-->

        <div class="input-container">
        <!--Esta linha abre uma nova caixinha de organização, idêntica à primeira, mas agora reservada para agrupar e estruturar visualmente o campo de senha do usuário.-->

            <i class="fa-solid fa-lock icon-left"></i>
            <!--Esta linha desenha um ícone de cadeado. As propriedades fa-solid fa-lock definem o desenho do cadeado trancado e a classe icon-left fixa a imagem do lado esquerdo interno do campo de preenchimento.-->

            <input type="password" id="l-pass" placeholder="Sua senha">
            <!--Esta linha cria o campo de texto para digitar a senha. O grande diferencial está no atributo type="password", que avisa ao navegador para ocultar os caracteres digitados por bolinhas pretas, protegendo a senha de olhares terceiros, enquanto o id="l-pass" serve de ponte de acesso para os códigos JavaScript.-->

            <i class="fa-solid fa-eye toggle-password" onclick="togglePassword()"></i>
            <!--Esta linha cria o ícone de "olhinho" usado para revelar a senha. A classe fa-solid fa-eye desenha o olho, a propriedade toggle-password posiciona ele no canto direito do campo, e o comando onclick="togglePassword()" diz ao navegador que, toda vez que o usuário clicar nesse olho, ele deve chamar e rodar uma função no código JavaScript que altera o campo de oculto para visível.-->

        </div>
        <!--Esta linha finaliza o escopo da segunda caixinha de entrada de dados.-->

        <button id="btn-login" class="btn-inactive" disabled onclick="autenticar()">AUTENTICAR NA REDE</button>
        <!--Esta linha cria o botão "AUTENTICAR NA REDE" usado para fazer login. O id="btn-login" nomeia o elemento, a classe class="btn-inactive" deixa ele visualmente cinza e apagado, o atributo disabled faz o navegador trancar o botão (impedindo cliques), e o onclick="autenticar()" define que, quando o botão estiver destrancado pelo sistema e for clicado, a função de checagem e login será acionada.-->

        <div style="margin-top: 20px; text-align: center;">
        <!--Esta linha abre uma caixinha simples para ajustar a posição do link de cadastro. A instrução style="..." empurra a caixa 20 pixels para baixo (afastando-se do botão) e centraliza o link exatamente no meio horizontal da página.-->

            <a href="register.html" style="color: #21d4fd; text-decoration: none; font-size: 0.9rem;">Criar nova
                identidade</a>
                <!--Esta linha cria o link clicável "Criar nova identidade". A tag a gera links de navegação, o atributo href="register.html" avisa ao navegador qual página deve ser aberta quando o usuário clicar ali, e as regras do style pintam o texto de azul claro, removem aquele risco sublinhado padrão dos links e encolhem um pouco o tamanho da letra.-->

        </div>
        <!--Esta linha fecha a caixinha de ajuste de posição do link.-->

    </div>
    <!--Esta linha fecha a grande caixa invisível central que envelopava todo o formulário. Isso conclui o empacotamento visual de toda a tela de login.-->

    <script type="module">
        //abre a seção de programação do site. O comando indica ao navegador que os próximos blocos não são elementos visuais, mas sim comandos de lógica JavaScript que rodarão de forma moderna, limpa e segura.//

        import { StorageService } from '../logic/storage.js';
        //importa um arquivo de códigos de fora para dentro da página atual. O sistema está buscando o motor de armazenamento (StorageService) que fica guardado lá na pasta de lógica (storage.js) para conseguir ler e salvar dados de usuários mais tarde.//

        window.validar = () => {
            //cria uma função chamada validar. Ao colocarmos window. na frente, estamos garantindo que essa função fique guardada na memória principal do navegador, permitindo que qualquer elemento da tela consiga chamá-la para verificar o formulário. O símbolo () => { abre a lista de comandos que essa função vai executar.//

            const e = document.getElementById('l-email').value.trim();
            //captura e limpa o e-mail digitado. O comando document.getElementById('l-email') localiza o campo de e-mail na tela; a propriedade .value pega o texto que está escrito dentro dele; e a função .trim() apaga automaticamente qualquer espaço em branco que o usuário tenha digitado sem querer no começo ou no final do texto.//

            const p = document.getElementById('l-pass').value.trim();
            //captura e limpa a senha digitada. De forma idêntica à linha anterior, ela localiza o campo de senha (l-pass), puxa o texto digitado e limpa os espaços vazios das pontas, guardando tudo na constante p.//

            const btn = document.getElementById('btn-login');
            //mapeia o botão de login. Ela cria uma constante chamada btn que serve como um "atalho" ou controle remoto apontado diretamente para o botão "AUTENTICAR NA REDE" da tela, permitindo alterar suas propriedades de forma mais rápida.//

            const light = document.getElementById('status-light');
            //cria um atalho para a bolinha de status. A constante light guarda a referência direta do círculo de luz (status-light), deixando-o pronto para ter sua cor alterada pelos próximos comandos lógicos.//

            const regexSeguranca = /^(?=.*[a-zA-Z])(?=.*\d)(?=.*[!@#$%^&*(),.?":{}|<>]).{8,}$/;
            //cria a regra de segurança da senha. Ela define uma expressão regular (um padrão de checagem) que obriga a senha a ter no mínimo 8 caracteres no total, contendo obrigatoriamente pelo menos uma letra, pelo menos um número e pelo menos um caractere especial (como @, !, #). É essa linha que valida senhas fortes.//

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            //cria a regra de validação do e-mail. Ela estabelece uma fórmula padrão para verificar se o que o usuário digitou realmente se parece com um e-mail válido, exigindo um bloco de texto, o símbolo @, outro bloco de texto, um ponto e o final da extensão (como .com).//

            if (emailRegex.test(e) && regexSeguranca.test(p)) {
                //avalia se o e-mail e a senha estão corretos ao mesmo tempo. O comando if abre um teste: o emailRegex.test(e) confere o e-mail e o regexSeguranca.test(p) confere a senha. O símbolo && significa "E", ou seja, o sistema só vai executar os próximos comandos de sucesso se o e-mail for válido E a senha também for aprovada na regra de segurança.//

                btn.className = 'btn-active';
                //ativa o visual do botão. Ela acessa o nosso botão através do atalho btn e troca a classe dele para btn-active, fazendo com que ele mude de cor e fique aceso na tela, sinalizando ao usuário que os dados estão corretos.//

                btn.disabled = false;
                //destranca o botão. Ao mudar a propriedade .disabled (desabilitado) para false (falso), o navegador permite que o usuário consiga clicar no botão para tentar se autenticar na rede.//

                light.className = 'status-light light-green';
                //muda a cor da luz de status para verde. Ela acessa a bolinha através do atalho light e atualiza suas classes para injetar a cor verde (light-green), mostrando visualmente que o formulário está preenchido corretamente e pronto.//

            } else {
                //A palavra else significa "caso contrário". Esta linha avisa ao navegador o que ele deve fazer se o e-mail ou a senha estiverem errados ou incompletos: ele vai ignorar os comandos de cima e rodar o bloco de código que vem a seguir.//

                btn.className = 'btn-inactive';
                //apaga o visual do botão. Ela devolve a classe btn-inactive para o botão, fazendo com que ele volte a ficar cinza e opaco, indicando que há algo incorreto nos campos.//

                btn.disabled = true;
                //tranca o botão novamente. Ao mudar a propriedade .disabled para true (verdadeiro), o navegador impede o usuário de clicar no botão, bloqueando o acesso até que os erros sejam corrigidos.//

                light.className = 'status-light light-red';
                //muda a cor da luz para vermelho. Ela redefine a bolinha indicadora para as classes de cor vermelha (light-red), sinalizando na tela que o estado atual do formulário é inválido ou inseguro.//
            }
        };
        
        document.getElementById('l-email').addEventListener('input',
        window.validar);
        //cria um "vigia" para o campo de e-mail. O comando procura o campo de e-mail (l-email) e adiciona um ouvinte de eventos (addEventListener). Esse ouvinte fica acordado monitorando o campo e, toda vez que o usuário digitar ou apagar uma única letra (input), ele chama automaticamente aquela função validar que criamos anteriormente para checar a tela.//

        document.getElementById('l-pass').addEventListener('input', window.validar);
        //cria um "vigia" idêntico para o campo de senha. Ela monitora o campo l-pass em tempo real e, a cada caractere que o usuário insere ou remove, dispara imediatamente a função validar para conferir se a senha cumpre os requisitos de segurança exigidos.//

        window.togglePassword = () => {
            //cria a função chamada togglePassword (que significa alternar senha). Ao colocarmos window. na frente, ela se torna visível para que o ícone do "olhinho" que configuramos no HTML consiga chamá-la quando receber um clique do usuário. O símbolo () => { abre a lista de ações que essa função vai executar.//

            const input = document.getElementById('l-pass');
            //cria uma constante interna chamada input que serve como um atalho direto para o campo de senha (l-pass). Isso evita que o navegador precise ficar procurando o campo na tela várias vezes durante o clique do usuário.//

            const icon = document.querySelector('.toggle-password');
            //cria um atalho para o desenho do olho. A constante icon localiza o ícone do olhinho na tela procurando pela sua classe de estilo (.toggle-password), permitindo que o sistema altere o desenho dele logo em seguida.//

            input.type = input.type === 'password' ? 'text' : 'password';
            //decide se mostra ou esconde o texto da senha usando uma pergunta rápida. Ela diz ao navegador: "O tipo atual do campo é senha oculta (password)? Se for verdadeiro (representado pelo ponto de interrogação ?), mude o tipo para texto comum (text) para que o usuário veja o que digitou. Se for falso (representado pelos dois pontos :), volte o tipo para oculto (password) novamente". Isso cria o efeito de clique para revelar.//

            icon.classList.toggle('fa-eye-slash');
            //altera o desenho do olho na tela. O comando classList.toggle funciona como um interruptor de lâmpada: se a classe fa-eye-slash (que desenha o olho cortado com um risco) não estiver no ícone, ele adiciona o risco; se já estiver lá, ele remove o risco e o olho volta a ficar aberto. Isso dá o feedback visual perfeito para o usuário saber o estado atual do campo.//

        };
        //fecha a lista de comandos da função togglePassword. A partir daqui, as instruções da função estão encerradas.

        window.autenticar = () => {
            //cria a função principal de login chamada autenticar. O prefixo window. faz com que essa função fique disponível para toda a página, permitindo que o botão "AUTENTICAR NA REDE" consiga rodar esses comandos no momento em que for clicado pelo usuário. O símbolo () => { abre as portas da função.//

            const e = document.getElementById('l-email').value;
            //captura o texto que está digitado no campo de e-mail. Ela vai até a tela, localiza o campo através do nome exclusivo l-email, puxa o que estiver escrito dentro dele e guarda esse texto na caixinha chamada e para usarmos na checagem.//

            const p = document.getElementById('l-pass').value;
            //faz exatamente o mesmo processo para a senha. O sistema localiza o campo pelo ID único l-pass, coleta os caracteres da senha digitada pelo usuário e armazena tudo em segurança dentro da constante chamada p.//

            const usuariosDaRede = JSON.parse(localStorage.getItem('alt_solution_users')) || [];
            //abre o "banco de dados" do navegador para ler os usuários cadastrados. O comando localStorage.getItem('alt_solution_users') busca a lista de usuários salvos na memória do computador. Como esses dados ficam guardados no formato de um texto corrido e trancado, o comando JSON.parse() entra em ação para transformar esse texto de volta em uma lista viva de cadastros. Se o sistema não encontrar nenhum usuário (banco vazio), o símbolo || [] garante a criação de uma lista vazia automática para o sistema não quebrar.//

            const user = usuariosDaRede.find(u => u.email === e && u.senha === p);
            //varre a lista de usuários para tentar encontrar o dono daquelas credenciais. O comando .find() faz uma busca rápida passando de cadastro em cadastro (representados pela letra u) e faz uma pergunta: "O e-mail deste cadastro é igual ao e-mail digitado (u.email === e) E a senha deste cadastro é igual à senha digitada (u.senha === p)?". Se encontrar alguém compatível, os dados desse usuário específico são isolados e guardados na constante user.//

            if (user) {
                //abre o teste de aprovação do login. O comando if (user) pergunta ao sistema: "A busca acima deu certo e encontramos um usuário correspondente no banco?". Se a resposta for sim, o navegador entra neste bloco e executa as próximas ordens luegos (que serão os comandos para dar as boas-vindas e liberar o acesso à tela principal do painel).//

                localStorage.setItem('usuario_sessao', JSON.stringify(user));
                //salva o usuário encontrado na "sessão ativa" do navegador. Ela pega o objeto com todas as informações do usuário logado (como nome e e-mail) e usa o comando JSON.stringify() para empacotar esses dados em um formato de texto. Depois, guarda esse pacote com o nome de 'usuario_sessao' para que as próximas páginas do site saibam quem é a pessoa que está navegando.//

                if (typeof StorageService !== 'undefined' && StorageService.setSession) {
                    //faz uma verificação dupla de segurança no sistema. Ela pergunta ao navegador: "O nosso motor avançado de armazenamento existe na memória (typeof StorageService !== 'undefined') E ele possui a função de salvar sessão pronta para uso (StorageService.setSession)?". Esse teste previne que o site trave caso algum arquivo externo de lógica não tenha carregado direito no navegador.//

                    StorageService.setSession(user);
                    //aciona o salvamento avançado. Caso o teste anterior tenha sido aprovado, o sistema chama a função do motor e entrega os dados do usuário (user) para que ele gerencie as permissões e a segurança de acesso nas regras internas.//

                }
                //Esta linha fecha o teste de segurança do motor avançado.

                console.log("Login autorizado para:", user.nome);
                //escreve um aviso de sucesso escondido no navegador. O comando console.log imprime uma mensagem no painel de controle do desenvolvedor dizendo "Login autorizado para:" seguido do nome do usuário que acabou de logar, o que é ótimo para o QA auditar se o sistema identificou a pessoa certa.//

                window.location.href = 'dashboard.html';
                //faz o redirecionamento automático de tela. Ao alterar o comando window.location.href para 'dashboard.html', o navegador imediatamente tira o usuário da tela de login e o leva direto para a página principal do painel do sistema.//

            } else {
                //A palavra else significa "caso contrário". Esta linha abre as instruções que o sistema deve rodar se o e-mail ou a senha digitados não forem encontrados no banco de dados, iniciando a exibição da mensagem de erro.//

                const toast = document.getElementById('error-toast');
                //localiza o componente de aviso na tela. Ela cria um atalho chamado toast que aponta diretamente para a caixinha invisível de erros (error-toast) que criamos no corpo do HTML.//

                toast.innerHTML = '<div style="text-align: center;">Acesso Negado ! <br><small style="font-size: 12px; display: block; margin-top: 4px; opacity: 0.9;">Clique em "Criar nova identidade" para se cadastrar.</small></div>';
                //escreve a mensagem de erro que vai aparecer na tela. O comando .innerHTML abre a caixinha de aviso e desenha lá dentro um texto estilizado dizendo "Acesso Negado!" em letras maiores e um lembrete em letras menores instruindo o usuário a criar uma nova conta se ele não for cadastrado.//

                toast.classList.add('show');
                //faz a mensagem de erro acender e aparecer na tela. Ela adiciona a classe show ao componente, ativando as regras visuais do CSS que fazem a caixinha deslizar ou surgir de forma suave para o usuário ver.//

                setTimeout(() => {
                    toast.classList.remove('show');
                }, 8000);
                //Este bloco cria um cronômetro de contagem regressiva invisível. O comando setTimeout programa uma tarefa para dali a pouco: ele aguarda exatamente 8000 milissegundos (8 segundos) e, assim que o tempo acaba, roda a linha de dentro retirando a classe show do aviso. Isso faz com que a mensagem de erro suma da tela sozinha, limpando a visão do usuário.//
            }
        };
        //Esta linha fecha a lista de instruções de toda a função autenticar.
        
        document.getElementById('l-pass').addEventListener('blur', window.validar);
        //cria um segundo vigia para o campo de senha. O comando monitora o evento blur, que acontece quando o usuário tira o cursor de dentro do campo e clica em qualquer outro lugar fora dele, forçando uma checagem automática dos dados naquele exato momento.//

        document.getElementById('l-email').addEventListener('blur', window.validar);
        //cria o mesmo vigia de perda de foco para o campo de e-mail, forçando a verificação de regras se o usuário clicar fora do campo, garantindo que as cores do botão e da luz mudem reativamente.//

    </script>
    <!--encerra a seção de códigos e programações de lógica da página.-->
